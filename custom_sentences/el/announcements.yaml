        out: "30"
      - in: "(μία ώρα πριν|μια ώρα πριν|1 ώρα πριν)"
        out: "60"
      - in: "(δύο ώρες πριν|2 ώρες πριν)"
        out: "120"
      - in: "(μία μέρα πριν|μια μέρα πριν|1 μέρα πριν)"
        out: "1440"
      - in: "(δύο μέρες πριν|2 μέρες πριν)"
        out: "2880"
      - in: "(μία εβδομάδα πριν|μια εβδομάδα πριν|1 εβδομάδα πριν)"
        out: "10080"