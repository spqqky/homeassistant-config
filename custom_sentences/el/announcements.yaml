language: "el"

lists:
  message:
    wildcard: true
  song:
    wildcard: true
  station:
    wildcard: true
    
  month:
    values:
      - in: "(Ιανουαρίου|Γενάρη)"
        out: "01"
      - in: "(Φεβρουαρίου|Φλεβάρη)"
        out: "02"
      - in: "(Μαρτίου|Μάρτη)"
        out: "03"
      - in: "(Απριλίου|Απρίλη)"
        out: "04"
      - in: "(Μαΐου|Μάη)"
        out: "05"
      - in: "(Ιουνίου|Ιούνη)"
        out: "06"
      - in: "(Ιουλίου|Ιούλη)"
        out: "07"
      - in: "(Αυγούστου|Αύγουστο)"
        out: "08"
      - in: "(Σεπτεμβρίου|Σεπτέμβρη)"
        out: "09"
      - in: "(Οκτωβρίου|Οκτώβρη)"
        out: "10"
      - in: "(Νοεμβρίου|Νοέμβρη)"
        out: "11"
      - in: "(Δεκεμβρίου|Δεκέμβρη)"
