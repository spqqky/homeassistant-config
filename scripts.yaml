reminder_create_chris:
  alias: Reminder - Create Chris
  description: Create a reminder for Chris. Use this whenever Chris asks to be reminded
    about something. Extract the event text, exact event date and time, and how many
    minutes before the event Chris wants the notification. Convert natural Greek date/time
    expressions to YYYY-MM-DD HH:MM:SS. If no advance reminder is specified, use 0
    minutes.
  mode: queued
  fields:
    reminder_text:
      name: Reminder text
      description: What Chris wants to be reminded about.
      required: true
      selector:
        text:
    event_datetime:
      name: Event date and time
      description: Exact event date and time in YYYY-MM-DD HH:MM:SS format.
      required: true
      selector:
        text:
    minutes_before:
      name: Minutes before
      description: 'Minutes before the event to notify Chris. Examples: 10, 30, 60,
        1440.'
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 10080
          step: 1
  sequence:
  - variables:
      event_ts: '{{ as_timestamp(strptime(event_datetime, ''%Y-%m-%d %H:%M:%S''))
        }}'
      reminder_ts: '{{ event_ts - ((minutes_before | int) * 60) }}'
      reminder_start: '{{ reminder_ts | timestamp_custom(''%Y-%m-%d %H:%M:%S'', true)
        }}'
      reminder_end: '{{ (reminder_ts + 60) | timestamp_custom(''%Y-%m-%d %H:%M:%S'',
        true) }}'
      event_display: '{{ event_ts | timestamp_custom(''%d/%m/%Y %H:%M'', true) }}'
  - condition: template
    value_template: '{{ event_ts > as_timestamp(now()) }}'
  - condition: template
    value_template: '{{ reminder_ts > as_timestamp(now()) }}'
  - action: calendar.create_event
    target:
      entity_id: calendar.reminders
    data:
      summary: '{{ reminder_text }}'
      description: 'Ραντεβού/γεγονός: {{ event_display }} | Υπενθύμιση {{ minutes_before
        }} λεπτά πριν.'
      start_date_time: '{{ reminder_start }}'
      end_date_time: '{{ reminder_end }}'
  - stop: Η υπενθύμιση δημιουργήθηκε επιτυχώς για {{ reminder_text }}, {{ minutes_before
      }} λεπτά πριν από το γεγονός.
reminder_find_chris:
  alias: Reminder - Find Chris
  description: Find upcoming reminders for Chris in calendar.reminders. Use this to
    answer questions about existing reminders and before attempting to cancel one.
    Search by subject, name or date. Never claim to have deleted an event.
  mode: single
  fields:
    search_text:
      name: Search text
      description: Optional keyword to search for, such as Mailo or κτηνίατρος. Leave
        empty to list all upcoming reminders.
      required: false
      default: ''
      selector:
        text:
  sequence:
  - action: calendar.get_events
    target:
      entity_id: calendar.reminders
    data:
      duration:
        days: 730
    response_variable: agenda
  - variables:
      results:
        events: '{{ agenda[''calendar.reminders''][''events''] | selectattr(''summary'',
          ''search'', search_text | default('''', true), ignorecase=True) | list }}'
        calendar: calendar.reminders
  - stop: Reminder search completed
    response_variable: results
reminder_delete_chris:
  alias: Reminder - Delete Chris
  description: Delete one reminder for Chris. Use only when Chris explicitly asks
    to cancel a reminder. Extract the subject and optional exact appointment date.
    If multiple reminders match, ask for clarification. Never claim deletion unless
    the returned status is deleted.
  mode: single
  fields:
    search_text:
      name: Search text
      description: Subject of the reminder to cancel, such as Mailo.
      required: true
      selector:
        text:
    event_date:
      name: Event date
      description: Optional date of the actual appointment in YYYY-MM-DD format. Leave
        empty when the user does not specify a date.
      required: false
      default: ''
      selector:
        text:
  sequence:
  - action: reminder_manager.delete_reminder
    data:
      search_text: '{{ search_text }}'
      event_date: '{{ event_date | default('''', true) }}'
    response_variable: deletion_result
  - stop: Reminder deletion request completed.
    response_variable: deletion_result
voice_pe_volume_control:
  alias: Voice PE - Volume Control
  description: Control the volume of the Home main Voice PE in the living room. Use
    when Chris asks to set the assistant volume, mute its speaker, or turn its sound
    back on. This does not change the JBL volume.
  mode: single
  fields:
    volume_percent:
      name: Volume percentage
      description: Requested Voice PE speaker volume from 0 to 100. Use 0 to mute.
        If Chris asks to turn the sound back on without specifying a level, use 50.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
  sequence:
  - action: media_player.volume_set
    target:
      entity_id: media_player.home_living_room_assistant
    data:
      volume_level: '{{ volume_percent | float / 100 }}'
  - stop: Η ένταση του Voice PE ρυθμίστηκε στο {{ volume_percent }}%.
jbl_volume_control:
  alias: JBL - Volume Control
  description: Control the volume of the JBL Nest speaker in the living room. Use
    when Chris explicitly asks to change the JBL or living room speaker volume. Do
    not change the Voice PE volume.
  mode: single
  fields:
    volume_percent:
      name: Volume percentage
      description: Requested JBL volume from 0 to 100. Use 0 for silence.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
  sequence:
  - action: media_player.volume_set
    target:
      entity_id: media_player.home_living_room_speaker
    data:
      volume_level: '{{ volume_percent | float / 100 }}'
  - stop: Η ένταση του JBL ρυθμίστηκε στο {{ volume_percent }}%.
nefeli_nest_volume_control:
  alias: Nefeli Nest - Volume Control
  description: Control the volume of the Nest Audio speaker in Nefeli's room. Use
    when Chris asks to change the volume of Nefeli's speaker or the speaker in Nefeli's
    room.
  mode: single
  fields:
    volume_percent:
      name: Volume percentage
      description: Requested volume from 0 to 100. Use 0 to mute.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
  sequence:
  - action: media_player.volume_set
    target:
      entity_id: media_player.home_nefeli_room_speaker
    data:
      volume_level: '{{ volume_percent | float / 100 }}'
  - stop: Η ένταση στο δωμάτιο της Νεφέλης ρυθμίστηκε στο {{ volume_percent }}%.
sarah_nest_volume_control:
  alias: Sarah Nest - Volume Control
  description: Control the volume of the Nest Mini speaker in Sarah's room or the
    main bedroom.
  mode: single
  fields:
    volume_percent:
      name: Volume percentage
      description: Requested speaker volume from 0 to 100. Use 0 to mute.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
  sequence:
  - action: media_player.volume_set
    target:
      entity_id: media_player.home_bedroom_speaker
    data:
      volume_level: '{{ volume_percent | float / 100 }}'
  - stop: Η ένταση στην κρεβατοκάμαρα ρυθμίστηκε στο {{ volume_percent }}%.
shopping_list_add_items:
  alias: Shopping List - Add Items
  description: 'Προσθέτει ένα ή περισσότερα προϊόντα στη λίστα αγορών. Χρησιμοποιείται
    από το Assist/Gemini για φωνητικές εντολές.

    '
  fields:
    products:
      name: Προϊόντα
      description: 'Προϊόντα χωρισμένα με κόμμα ή με τη λέξη "και". Παράδειγμα: γάλα,
        βούτυρο και τυρί

        '
      required: true
      selector:
        text:
  sequence:
  - variables:
      items: "{{ (products\n  | regex_replace('(?i)\\s+και\\s+', ','))\n  .split(',')
        }}\n"
  - repeat:
      for_each: '{{ items }}'
      sequence:
      - variables:
          product_name: '{{ repeat.item | trim }}'
      - condition: template
        value_template: '{{ product_name | length > 0 }}'
      - action: shopping_list.add_item
        data:
          name: '{{ product_name }}'
  mode: queued
  max: 10
shopping_list_read_items:
  alias: Shopping List - Read Items
  description: 'Επιστρέφει τα προϊόντα που υπάρχουν αυτή τη στιγμή στη λίστα αγορών.
    Χρησιμοποίησε αυτό το script όταν ο χρήστης ρωτά τι έχει στη λίστα για ψώνια,
    τι χρειάζεται να αγοράσει ή τι υπάρχει στη shopping list.

    '
  sequence:
  - action: todo.get_items
    target:
      entity_id: todo.shopping_list
    data:
      status: needs_action
    response_variable: shopping_items
  - variables:
      item_names: "{{ shopping_items['todo.shopping_list']['items']\n   | map(attribute='summary')\n
        \  | list }}\n"
      result:
        items: "{{ shopping_items['todo.shopping_list']['items']\n   | map(attribute='summary')\n
          \  | list }}\n"
        text: "{% set names = shopping_items['todo.shopping_list']['items']\n   |
          map(attribute='summary')\n   | list %}\n{% if names | length == 0 %}\n  Η
          λίστα για ψώνια είναι άδεια.\n{% else %}\n  Στη λίστα για ψώνια έχεις {{
          names | join(', ') }}.\n{% endif %}\n"
  - stop: Shopping list returned
    response_variable: result
  mode: single
studio_led_disco_mode:
  alias: Studio LED Disco Mode
  description: Συνεχής εναλλαγή RGB χρωμάτων στα LED του studio
  sequence:
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.pinkradio_led_main
        data:
          rgbw_color:
          - 226
          - 100
          - 216
          - 0
          brightness_pct: 75
          transition: 2
      - delay: 00:00:03
      - action: light.turn_on
        target:
          entity_id: light.pinkradio_led_main
        data:
          rgbw_color:
          - 130
          - 0
          - 255
          - 0
          brightness_pct: 75
          transition: 2
      - delay: 00:00:03
      - action: light.turn_on
        target:
          entity_id: light.pinkradio_led_main
        data:
          rgbw_color:
          - 0
          - 40
          - 255
          - 0
          brightness_pct: 75
          transition: 2
      - delay: 00:00:03
      - action: light.turn_on
        target:
          entity_id: light.pinkradio_led_main
        data:
          rgbw_color:
          - 0
          - 255
          - 255
          - 0
          brightness_pct: 75
          transition: 2
      - delay: 00:00:03
      - action: light.turn_on
        target:
          entity_id: light.pinkradio_led_main
        data:
          rgbw_color:
          - 255
          - 0
          - 255
          - 0
          brightness_pct: 75
          transition: 2
      - delay: 00:00:03
      - action: light.turn_on
        target:
          entity_id: light.pinkradio_led_main
        data:
          rgbw_color:
          - 255
          - 0
          - 0
          - 0
          brightness_pct: 75
          transition: 2
      - delay: 00:00:03
  mode: restart
pink_radio_neon_control:
  alias: Pink Radio - Neon Control
  mode: single
  fields:
    action:
      required: true
      selector:
        select:
          options:
          - 'on'
          - 'off'
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ action == ''on'' }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.pinkradio_neon_onair
          - switch.pinkradio_neon_anarchy
          - switch.pinkradio_neon_thunder
          - switch.pinkradio_neon_logo
    - conditions:
      - condition: template
        value_template: '{{ action == ''off'' }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.pinkradio_neon_onair
          - switch.pinkradio_neon_anarchy
          - switch.pinkradio_neon_thunder
          - switch.pinkradio_neon_logo
  description: ''
pink_radio_studio_audio_control:
  alias: Pink Radio - Studio Audio Control
  mode: single
  fields:
    action:
      required: true
      selector:
        select:
          options:
          - 'on'
          - 'off'
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ action == ''on'' }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.pinkradio_onyx_console
          - switch.pinkradio_krk_speakers
    - conditions:
      - condition: template
        value_template: '{{ action == ''off'' }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.pinkradio_onyx_console
          - switch.pinkradio_krk_speakers
pink_radio_studio_control:
  alias: Pink Radio - Studio Control
  description: Κεντρικός έλεγχος προετοιμασίας και κλεισίματος του Pink Radio studio
  mode: single
  fields:
    studio_action:
      name: Action
      required: true
      selector:
        select:
          options:
          - prepare
          - 'off'
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ studio_action == ''prepare'' }}'
      sequence:
      - action: script.pink_radio_studio_audio_control
        data:
          action: 'on'
      - action: script.pink_radio_neon_control
        data:
          action: 'on'
      - action: light.turn_on
        target:
          entity_id:
          - light.pinkradio_led_main
        data:
          rgb_color:
          - 226
          - 100
          - 216
          brightness_pct: 70
    - conditions:
      - condition: template
        value_template: '{{ studio_action == ''off'' }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.pinkradio_led_main
      - action: script.pink_radio_neon_control
        data:
          action: 'off'
      - action: script.pink_radio_studio_audio_control
        data:
          action: 'off'
