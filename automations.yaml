      - condition: trigger
        id: dock_status
      sequence:
      - set_conversation_response: '{% set s = states(''vacuum.pinkradio_vacuum'')
          %} {% set d = state_attr(''vacuum.pinkradio_vacuum'',
          ''vacuum.status_desc'') %} {% if s == ''docked'' or d in [''Charged'',''Charging'']
          %}Ναι, η σκούπα στο Pink Radio είναι στη βάση.{% else %}Όχι, η σκούπα στο
          Pink Radio δεν είναι αυτή τη στιγμή στη βάση.{% endif %}'
