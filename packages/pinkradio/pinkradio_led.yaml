script:
  studio_led_disco_mode:
    alias: Studio LED Disco Mode
    description: Συνεχής εναλλαγή RGB χρωμάτων στα LED του studio
    sequence:
    - repeat:
        while:
        - condition: template
          value_template: '{{ true }}'
        sequence:
        - action: light.turn_on
          target:
            entity_id: light.pinkradio_led_main
          data:
            rgbw_color:
            - 226
            - 100
            - 216
            - 0
            brightness_pct: 75
            transition: 2
        - delay: 00:00:03
        - action: light.turn_on
          target:
            entity_id: light.pinkradio_led_main
          data:
            rgbw_color:
            - 130
            - 0
            - 255
            - 0
            brightness_pct: 75
            transition: 2
        - delay: 00:00:03
        - action: light.turn_on
          target:
            entity_id: light.pinkradio_led_main
          data:
            rgbw_color:
            - 0
            - 40
            - 255
            - 0
            brightness_pct: 75
            transition: 2
        - delay: 00:00:03
        - action: light.turn_on
          target:
            entity_id: light.pinkradio_led_main
          data:
            rgbw_color:
            - 0
            - 255
            - 255
            - 0
            brightness_pct: 75
            transition: 2
        - delay: 00:00:03
        - action: light.turn_on
          target:
            entity_id: light.pinkradio_led_main
          data:
            rgbw_color:
            - 255
            - 0
            - 255
            - 0
            brightness_pct: 75
            transition: 2
        - delay: 00:00:03
        - action: light.turn_on
          target:
            entity_id: light.pinkradio_led_main
          data:
            rgbw_color:
            - 255
            - 0
            - 0
            - 0
            brightness_pct: 75
            transition: 2
        - delay: 00:00:03
    mode: restart
