  - id: '1790868698494'
    alias: Voice - Studio LED Modes
    description: Φωτιστικά modes για τα LED του Pink Radio studio
    triggers:
    - trigger: conversation
      command:
      - βάλε τα led στο στούντιο σε pink radio mode
      - βάλε σε pink radio mode στα led στο στούντιο
      id: pink
    - trigger: conversation
      command:
      - βάλε τα led στο στούντιο σε on air mode
      - βάλε on air mode στα led στο στούντιο
      id: on_air
    - trigger: conversation
      command:
      - βάλε τα led στο στούντιο σε rock mode
      - βάλε rock mode στα led στο στούντιο
      id: rock
    - trigger: conversation
      command:
      - βάλε τα led στο στούντιο night mode
      - βάλε night mode στα led στο στούντιο
      - βάλε νυχτερινό φωτισμό στα led στο στούντιο
      id: night
    actions:
    - alias: "Guard: μόνο από το studio ή το σαλόνι"
      if:
        - condition: template
          value_template: >-
            {% set d = trigger.device_id | default(none) %}
            {% set a = area_id(d) if d else none %}
            {{ d is not none and not (a in ['pinkradio_studio', 'living_room'] or floor_id(d) == 'pinkradio') }}
      then:
        - set_conversation_response: Αυτό γίνεται μόνο από το studio ή το σαλόνι.
        - stop: Εκτός scope (pinkradio)
    - choose:
      - conditions:
        - condition: trigger
          id: pink
        sequence:
        - action: light.turn_on
          target:
            entity_id: light.pinkradio_led_main
          data:
            rgbw_color:
            - 226
            - 100
            - 216
            - 0
            brightness_pct: 80
            transition: 2
      - conditions:
        - condition: trigger
          id: on_air
        sequence:
        - action: light.turn_on
          target:
            entity_id: light.pinkradio_led_main
          data:
            rgbw_color:
            - 255
            - 0
            - 0
            - 0
            brightness_pct: 75
            transition: 2
      - conditions:
        - condition: trigger
          id: rock
        sequence:
        - action: light.turn_on
          target:
            entity_id: light.pinkradio_led_main
          data:
            rgbw_color:
            - 120
            - 0
            - 255
            - 0
            brightness_pct: 65
            transition: 2
        - set_conversation_response: ROCK MODE TEST ενεργοποιήθηκε.
      - conditions:
        - condition: trigger
          id: night
        sequence:
        - action: light.turn_on
          target:
            entity_id: light.pinkradio_led_main
          data:
            rgbw_color:
            - 255
            - 70
            - 10
            - 0
            brightness_pct: 25
            transition: 3
    mode: single
