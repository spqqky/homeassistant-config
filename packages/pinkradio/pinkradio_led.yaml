# packages/pinkradio/pinkradio_led.yaml (scope: pinkradio, βήμα 8β)
#
# Ένα automation για όλα τα LED του studio (αντικαθιστά τα 11 παλιά «Voice - LED …»).
#
# Ποια LED:
#   «ντραμς / drums / τύμπανα»  → light.pinkradio_led_drums
#   «κύρια / main / ταβάνι»     → light.pinkradio_led_main
#   τίποτα ή «στο στούντιο»     → και τα δύο (όπως τα κουμπιά του dashboard)
#
# Τρεις τύποι εντολής:
#   on / off   «άναψε / σβήσε τα led [στα ντραμς]»
#   up / down  «δυνάμωσε / χαμήλωσε τα led [στα ντραμς]»
#   set        «κάνε / βάλε / άλλαξε τα led <ό,τι>» και «led <ό,τι>». Το <ό,τι> διαβάζεται από το template:
#              mode (pink radio, on air, rock, night) → disco → πιο φωτεινά/χαμηλά → αριθμός (%) → χρώμα.
#   disco      «βάλε / ξεκίνα / σταμάτα disco [στο στούντιο]»
#
# Ο στόχος και η τιμή βγαίνουν από ολόκληρη τη φράση (trigger.sentence), όχι από το slot,
# ώστε «κάνε τα led στα ντραμς κόκκινα» και «κάνε τα led κόκκινα στα ντραμς» να δουλεύουν ίδια.
# Κάθε εντολή εκτός από disco σταματά πρώτα το disco.

automation:
- id: pinkradio_voice_led
  alias: Pink Radio - Voice LED
  description: LED studio και ντραμς. on/off, φωτεινότητα, χρώματα, modes, disco.
  mode: queued
  max: 5
  triggers:
  - trigger: conversation
    id: 'on'
    command:
    - (άναψε|ανάψε|άνοιξε|ανοίξε|ενεργοποίησε) [όλα ](τα led|τα λεντ|τα φώτα led|τον φωτισμό led|τον led φωτισμό|τον φωτισμό) [(στο|στα|του|των) (στούντιο|studio|ντραμς|drums|τύμπανα)]
    - (άναψε|ανάψε|άνοιξε|ανοίξε|ενεργοποίησε) τα (ντραμς|drums|κύρια|main) led
  - trigger: conversation
    id: 'off'
    command:
    - (κλείσε|σβήσε|σβήσαι|σβήστε|απενεργοποίησε) [όλα ](τα led|τα λεντ|τα φώτα led|τον φωτισμό led|τον led φωτισμό|τον φωτισμό) [(στο|στα|του|των) (στούντιο|studio|ντραμς|drums|τύμπανα)]
    - (κλείσε|σβήσε|σβήσαι|σβήστε|απενεργοποίησε) τα (ντραμς|drums|κύρια|main) led
  - trigger: conversation
    id: up
    command:
    - (δυνάμωσε|ανέβασε|αύξησε) [τη φωτεινότητα ](τα|στα) (led|λεντ) [(στο|στα|του|των) (στούντιο|studio|ντραμς|drums|τύμπανα)]
  - trigger: conversation
    id: down
    command:
    - (χαμήλωσε|μείωσε|κατέβασε) [τη φωτεινότητα ](τα|στα) (led|λεντ) [(στο|στα|του|των) (στούντιο|studio|ντραμς|drums|τύμπανα)]
  - trigger: conversation
    id: disco_start
    command:
    - (βάλε|ξεκίνα|άνοιξε|άναψε) [το ](disco|ντίσκο) [mode] [(στο|στα|του) (στούντιο|studio|led)]
  - trigger: conversation
    id: disco_stop
    command:
    - (σταμάτα|κλείσε|σβήσε) [το ](disco|ντίσκο) [mode] [(στο|στα|του) (στούντιο|studio|led)]
  - trigger: conversation
    id: set
    command:
    - (κάνε|βάλε|άλλαξε|γύρνα) [όλα ](τα led|τα λεντ|τα φώτα led|τον φωτισμό|τα (ντραμς|drums|κύρια|main|studio) led) {value}
    - (led|λεντ) {value}
  conditions: []
  actions:
  - alias: 'Guard: μόνο από το studio ή το σαλόνι'
    if:
    - condition: template
      value_template: >-
        {% set d = trigger.device_id | default(none) %}
        {% set a = area_id(d) if d else none %}
        {{ d is not none and not (a in ['pinkradio_studio', 'living_room'] or floor_id(d) == 'pinkradio') }}
    then:
    - set_conversation_response: Αυτό γίνεται μόνο από το studio ή το σαλόνι.
    - stop: Εκτός scope (pinkradio)
  - variables:
      main: light.pinkradio_led_main
      drums: light.pinkradio_led_drums
      text: "{{ trigger.sentence | lower }}"
      is_drums: "{{ ['ντραμς', 'ντράμς', 'drums', 'τύμπανα'] | select('in', text) | list | count > 0 }}"
      is_main: "{{ ['κύρια', 'κυρια', 'main', 'ταβάνι', 'ταβανι'] | select('in', text) | list | count > 0 }}"
      lights: >-
        {{ [drums] if (is_drums and not is_main) else ([main] if (is_main and not is_drums) else [main, drums]) }}
      where: >-
        {{ ' στα ντραμς' if lights == [drums] else (' στα κύρια' if lights == [main] else '') }}
      # Χρώματα: τα σύνθετα πρώτα (ζεστό λευκό πριν από λευκό, σκούρο μπλε πριν από μπλε). Ταίριασμα με ρίζα.
      colors:
      - {k: ['ζεστό λευκ', 'ζεστο λευκ', 'ζεστά λευκ', 'ζεστα λευκ', 'warm white'], rgbw: [255, 160, 80, 0], n: ζεστό λευκό}
      - {k: ['σκούρο μπλε', 'σκουρο μπλε', 'deep blue'], rgbw: [0, 30, 255, 0], n: σκούρο μπλε}
      - {k: ['γαλάζ', 'γαλαζ', 'light blue'], rgbw: [0, 150, 255, 0], n: γαλάζιο}
      - {k: ['τυρκουάζ', 'τυρκουαζ', 'turquoise'], rgbw: [0, 255, 180, 0], n: τυρκουάζ}
      - {k: ['θαλασσ', 'κυαν', 'cyan'], rgbw: [0, 255, 255, 0], n: κυανό}
      - {k: ['ματζέντα', 'ματζεντα', 'φούξια', 'φουξια', 'magenta', 'fuchsia'], rgbw: [255, 0, 255, 0], n: φούξια}
      - {k: ['βιολετ', 'violet'], rgbw: [180, 0, 255, 0], n: βιολετί}
      - {k: ['μωβ', 'μοβ', 'purple'], rgbw: [128, 0, 255, 0], n: μωβ}
      - {k: ['ροζ', 'pink'], rgbw: [226, 100, 216, 0], n: ροζ}
      - {k: ['κόκκιν', 'κοκκιν', 'red'], rgbw: [255, 0, 0, 0], n: κόκκινο}
      - {k: ['πορτοκαλ', 'orange'], rgbw: [255, 80, 0, 0], n: πορτοκαλί}
      - {k: ['χρυσ', 'gold'], rgbw: [255, 150, 0, 0], n: χρυσό}
      - {k: ['κίτριν', 'κιτριν', 'yellow'], rgbw: [255, 255, 0, 0], n: κίτρινο}
      - {k: ['λάιμ', 'λαιμ', 'lime'], rgbw: [150, 255, 0, 0], n: λάιμ}
      - {k: ['μέντα', 'μεντα', 'mint'], rgbw: [50, 255, 150, 0], n: μέντα}
      - {k: ['πράσιν', 'πρασιν', 'green'], rgbw: [0, 255, 0, 0], n: πράσινο}
      - {k: ['μπλε', 'blue'], rgbw: [0, 0, 255, 0], n: μπλε}
      - {k: ['λευκ', 'άσπρ', 'ασπρ', 'white'], rgbw: [255, 255, 255, 0], n: λευκό}
      modes:
      - {k: ['pink radio', 'πινκ ρέιντιο', 'πινκ ράδιο'], rgbw: [226, 100, 216, 0], b: 80, t: 2, n: Pink Radio}
      - {k: ['on air', 'ον έαρ', 'ον έρ', 'όν έρ'], rgbw: [255, 0, 0, 0], b: 75, t: 2, n: ON AIR}
      - {k: ['rock', 'ροκ'], rgbw: [120, 0, 255, 0], b: 65, t: 2, n: Rock}
      - {k: ['night', 'νυχτ', 'νύχτ'], rgbw: [255, 70, 10, 0], b: 25, t: 3, n: Night}
      value: "{{ trigger.slots.value | default('') }}"
      # Τι ζητήθηκε στην εντολή «set»: mode → disco → step → % → χρώμα
      mode_i: >-
        {%- set ns = namespace(i=-1) -%}
        {%- for m in modes -%}{%- if ns.i < 0 and (m.k | select('in', text) | list | count > 0) -%}{%- set ns.i = loop.index0 -%}{%- endif -%}{%- endfor -%}
        {{- ns.i -}}
      color_i: >-
        {%- set ns = namespace(i=-1) -%}
        {%- for c in colors -%}{%- if ns.i < 0 and (c.k | select('in', text) | list | count > 0) -%}{%- set ns.i = loop.index0 -%}{%- endif -%}{%- endfor -%}
        {{- ns.i -}}
      level: "{{ text | regex_findall('[0-9]+') | first | default(-1) | int(-1) }}"
      kind: >-
        {%- if trigger.id != 'set' -%}{{ trigger.id }}
        {%- elif mode_i >= 0 -%}mode
        {%- elif 'disco' in text or 'ντίσκο' in text -%}disco_start
        {%- elif ['πιο φωτειν', 'πιο δυνατ', 'πιο έντον'] | select('in', text) | list | count > 0 -%}up
        {%- elif ['πιο χαμηλ', 'πιο σκοτειν', 'πιο αχν', 'πιο απαλ'] | select('in', text) | list | count > 0 -%}down
        {%- elif level >= 0 -%}brightness
        {%- elif color_i >= 0 -%}color
        {%- else -%}unknown{%- endif -%}
      mode_hit: "{{ modes[mode_i] if mode_i >= 0 else {} }}"
      color_hit: "{{ colors[color_i] if color_i >= 0 else {} }}"
      pct: "{{ [[level, 1] | max, 100] | min }}"
  - if: "{{ kind not in ['disco_start', 'unknown'] }}"
    then:
    - action: script.turn_off
      target:
        entity_id: script.pinkradio_led_disco_mode
  - choose:
    - conditions: "{{ kind == 'on' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: "{{ lights }}"
      - set_conversation_response: "Άναψα τα LED{{ where }}."
    - conditions: "{{ kind == 'off' }}"
      sequence:
      - action: light.turn_off
        target:
          entity_id: "{{ lights }}"
      - set_conversation_response: "Έκλεισα τα LED{{ where }}."
    - conditions: "{{ kind in ['up', 'down'] }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: "{{ lights }}"
        data:
          brightness_step_pct: "{{ 15 if kind == 'up' else -15 }}"
          transition: 1
      - set_conversation_response: "{{ 'Δυνάμωσα' if kind == 'up' else 'Χαμήλωσα' }} τα LED{{ where }}."
    - conditions: "{{ kind == 'brightness' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: "{{ lights }}"
        data:
          brightness_pct: "{{ pct }}"
      - set_conversation_response: "Έβαλα τα LED{{ where }} στο {{ pct }}%."
    - conditions: "{{ kind == 'color' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: "{{ lights }}"
        data:
          rgbw_color: "{{ color_hit.rgbw }}"
      - set_conversation_response: "Έκανα τα LED{{ where }} {{ color_hit.n }}."
    - conditions: "{{ kind == 'mode' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: "{{ lights }}"
        data:
          rgbw_color: "{{ mode_hit.rgbw }}"
          brightness_pct: "{{ mode_hit.b }}"
          transition: "{{ mode_hit.t }}"
      - set_conversation_response: "{{ mode_hit.n }} mode στα LED{{ where }}."
    - conditions: "{{ kind == 'disco_start' }}"
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.pinkradio_led_disco_mode
      - set_conversation_response: Ξεκίνησα το disco.
    - conditions: "{{ kind == 'disco_stop' }}"
      sequence:
      - set_conversation_response: Σταμάτησα το disco.
    default:
    - set_conversation_response: "Δεν κατάλαβα τι να κάνω στα LED: {{ value }}."

script:
  pinkradio_led_disco_mode:
    alias: Pink Radio - LED Disco Mode
    description: Συνεχής εναλλαγή χρωμάτων σε όλα τα LED του studio. Σταματά με script.turn_off ή με οποιαδήποτε άλλη φωνητική εντολή LED.
    mode: restart
    icon: mdi:disc
    variables:
      steps:
      - [226, 100, 216, 0]
      - [130, 0, 255, 0]
      - [0, 40, 255, 0]
      - [0, 255, 255, 0]
      - [255, 0, 255, 0]
      - [255, 0, 0, 0]
    sequence:
    - repeat:
        while: "{{ true }}"
        sequence:
        - repeat:
            for_each: "{{ steps }}"
            sequence:
            - action: light.turn_on
              target:
                entity_id:
                - light.pinkradio_led_main
                - light.pinkradio_led_drums
              data:
                brightness_pct: 75
                rgbw_color: "{{ repeat.item }}"
                transition: 2
            - delay: 3
