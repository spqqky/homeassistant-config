# packages/pinkradio/pinkradio_led.yaml (scope: pinkradio)
# Μεταφέρθηκε αυτούσιο από automations.yaml/scripts.yaml στο βήμα 2β. Επεξεργασία μόνο εδώ, όχι από το UI.

automation:
  - id: '1790868096413'
    alias: Voice - LED ON/OFF Studio
    description: Άνοιγμα/Σβήσιμο των LED στο studio με φωνητική εντολή
    triggers:
    - trigger: conversation
      command:
      - άναψε τα led στο στούντιο
      - άνοιξε τα led στο στούντιο
      - άναψε τα φώτα led στο στούντιο
      - άνοιξε τα φώτα led στο στούντιο
      - άναψε τον φωτισμό led στο στούντιο
      - άνοιξε τον φωτισμό led στο στούντιο
      - άναψε τον led φωτισμό στο στούντιο
      - άνοιξε τον led φωτισμό στο στούντιο
      id: led_on
    - trigger: conversation
      command:
      - κλείσε τα led στο στούντιο
      - σβήσε τα led στο στούντιο
      - κλείσε τα φώτα led στο στούντιο
      - σβήσε τα φώτα led στο στούντιο
      - κλείσε τον φωτισμό led στο στούντιο
      - σβήσε τον φωτισμό led στο στούντιο
      id: led_οff
    actions:
    - alias: "Guard: μόνο από το studio ή το σαλόνι"
      if:
        - condition: template
          value_template: >-
            {% set d = trigger.device_id | default(none) %}
            {% set a = area_id(d) if d else none %}
            {{ d is not none and not (a in ['pinkradio_studio', 'living_room'] or floor_id(d) == 'pinkradio') }}
      then:
        - set_conversation_response: Αυτό γίνεται μόνο από το studio ή το σαλόνι.
        - stop: Εκτός scope (pinkradio)
    - choose:
      - conditions:
        - condition: trigger
          id: led_on
        sequence:
        - action: light.turn_on
          target:
            entity_id: light.pinkradio_led_main
        - set_conversation_response: Άναψα τα LED στο στούντιο.
      - conditions:
        - condition: trigger
          id: led_οff
        sequence:
        - action: light.turn_off
          target:
            entity_id: light.pinkradio_led_main
        - set_conversation_response: Έκλεισα τα LED στο στούντιο.
    mode: single
