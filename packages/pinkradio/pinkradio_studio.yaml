# packages/pinkradio/pinkradio_studio.yaml (scope: pinkradio, βήμα 8α)
#
# «άναψε/κλείσε <συσκευή> [στο στούντιο]». Ένα trigger id ανά συσκευή και κατάσταση: <target>__on / <target>__off.
# Παραλλαγές inline (οι λίστες του custom_sentences ΔΕΝ λειτουργούν στα triggers).
# «τον ήχο» θέλει πάντα «στο στούντιο», για να μην κλείνει το studio όταν στο σαλόνι εννοείς την TV.
# Πρίζες: plug1 KRK αριστερό · plug2 ON AIR · plug3 Anarchy · plug4 Thunder · plug5 Pink Radio (logo)
#         plug6 κονσόλα Onyx · plug7 KRK δεξί · plug8 ενισχυτής κιθάρας

automation:
- id: pinkradio_voice_studio
  alias: Pink Radio - Voice Studio
  description: Neon (όλα ή ένα-ένα), κονσόλα, KRK, ήχος, ενισχυτής, άνοιγμα/κλείσιμο studio.
  mode: queued
  max: 5
  triggers:
  - trigger: conversation
    id: neon_all__on
    command:
    - "((άναψε|αναψε)|(ανάψε|αναψε)|(άνοιξε|ανοιξε)|(ανοίξε|ανοιξε)|(ενεργοποίησε|ενεργοποιησε)) [(όλα|ολα) ](τα|τις) (neon|(νέον|νεον)|(νέων|νεων)|νεον|(πινακίδες|πινακιδες)|(ταμπέλες|ταμπελες)) [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: neon_all__off
    command:
    - "((κλείσε|κλεισε)|(σβήσε|σβησε)|(σβήσαι|σβησαι)|(σβήστε|σβηστε)|(απενεργοποίησε|απενεργοποιησε)) [(όλα|ολα) ](τα|τις) (neon|(νέον|νεον)|(νέων|νεων)|νεον|(πινακίδες|πινακιδες)|(ταμπέλες|ταμπελες)) [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: neon_onair__on
    command:
    - "((άναψε|αναψε)|(ανάψε|αναψε)|(άνοιξε|ανοιξε)|(ανοίξε|ανοιξε)|(ενεργοποίησε|ενεργοποιησε)) το (on air|ον (έαρ|εαρ)|ον αιρ|(όν|ον) (έρ|ερ)) [(neon|(νέον|νεον))] [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: neon_onair__off
    command:
    - "((κλείσε|κλεισε)|(σβήσε|σβησε)|(σβήσαι|σβησαι)|(σβήστε|σβηστε)|(απενεργοποίησε|απενεργοποιησε)) το (on air|ον (έαρ|εαρ)|ον αιρ|(όν|ον) (έρ|ερ)) [(neon|(νέον|νεον))] [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: neon_logo__on
    command:
    - "((άναψε|αναψε)|(ανάψε|αναψε)|(άνοιξε|ανοιξε)|(ανοίξε|ανοιξε)|(ενεργοποίησε|ενεργοποιησε)) (το neon pink radio|το (νέον|νεον) pink radio|το pink radio neon|το pink radio (νέον|νεον)|το (λογότυπο|λογοτυπο)|το logo) [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: neon_logo__off
    command:
    - "((κλείσε|κλεισε)|(σβήσε|σβησε)|(σβήσαι|σβησαι)|(σβήστε|σβηστε)|(απενεργοποίησε|απενεργοποιησε)) (το neon pink radio|το (νέον|νεον) pink radio|το pink radio neon|το pink radio (νέον|νεον)|το (λογότυπο|λογοτυπο)|το logo) [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: anarchy__on
    command:
    - "((άναψε|αναψε)|(ανάψε|αναψε)|(άνοιξε|ανοιξε)|(ανοίξε|ανοιξε)|(ενεργοποίησε|ενεργοποιησε)) (το|την) (anarchy|(αναρχία|αναρχια)|(ανάρκι|αναρκι)) [(neon|(νέον|νεον))] [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: anarchy__off
    command:
    - "((κλείσε|κλεισε)|(σβήσε|σβησε)|(σβήσαι|σβησαι)|(σβήστε|σβηστε)|(απενεργοποίησε|απενεργοποιησε)) (το|την) (anarchy|(αναρχία|αναρχια)|(ανάρκι|αναρκι)) [(neon|(νέον|νεον))] [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: thunder__on
    command:
    - "((άναψε|αναψε)|(ανάψε|αναψε)|(άνοιξε|ανοιξε)|(ανοίξε|ανοιξε)|(ενεργοποίησε|ενεργοποιησε)) (το|τον) (thunder|(θάντερ|θαντερ)|(κεραυνό|κεραυνο)) [(neon|(νέον|νεον))] [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: thunder__off
    command:
    - "((κλείσε|κλεισε)|(σβήσε|σβησε)|(σβήσαι|σβησαι)|(σβήστε|σβηστε)|(απενεργοποίησε|απενεργοποιησε)) (το|τον) (thunder|(θάντερ|θαντερ)|(κεραυνό|κεραυνο)) [(neon|(νέον|νεον))] [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: console__on
    command:
    - "((άναψε|αναψε)|(ανάψε|αναψε)|(άνοιξε|ανοιξε)|(ανοίξε|ανοιξε)|(ενεργοποίησε|ενεργοποιησε)) (την (κονσόλα|κονσολα)|το (μίξερ|μιξερ)|την onyx|το onyx) [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: console__off
    command:
    - "((κλείσε|κλεισε)|(σβήσε|σβησε)|(σβήσαι|σβησαι)|(σβήστε|σβηστε)|(απενεργοποίησε|απενεργοποιησε)) (την (κονσόλα|κονσολα)|το (μίξερ|μιξερ)|την onyx|το onyx) [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: krk_left__on
    command:
    - "((άναψε|αναψε)|(ανάψε|αναψε)|(άνοιξε|ανοιξε)|(ανοίξε|ανοιξε)|(ενεργοποίησε|ενεργοποιησε)) (το (αριστερό|αριστερο) ((ηχείο|ηχειο)|krk)|το krk (αριστερό|αριστερο)) [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: krk_left__off
    command:
    - "((κλείσε|κλεισε)|(σβήσε|σβησε)|(σβήσαι|σβησαι)|(σβήστε|σβηστε)|(απενεργοποίησε|απενεργοποιησε)) (το (αριστερό|αριστερο) ((ηχείο|ηχειο)|krk)|το krk (αριστερό|αριστερο)) [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: krk_right__on
    command:
    - "((άναψε|αναψε)|(ανάψε|αναψε)|(άνοιξε|ανοιξε)|(ανοίξε|ανοιξε)|(ενεργοποίησε|ενεργοποιησε)) (το (δεξί|δεξι) ((ηχείο|ηχειο)|krk)|το krk (δεξί|δεξι)) [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: krk_right__off
    command:
    - "((κλείσε|κλεισε)|(σβήσε|σβησε)|(σβήσαι|σβησαι)|(σβήστε|σβηστε)|(απενεργοποίησε|απενεργοποιησε)) (το (δεξί|δεξι) ((ηχείο|ηχειο)|krk)|το krk (δεξί|δεξι)) [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: audio__on
    command:
    - "((άναψε|αναψε)|(ανάψε|αναψε)|(άνοιξε|ανοιξε)|(ανοίξε|ανοιξε)|(ενεργοποίησε|ενεργοποιησε)) (τα (ηχεία|ηχεια)|τα krk|την (κονσόλα|κονσολα) και τα (ηχεία|ηχεια)|(κονσόλα|κονσολα) και (ηχεία|ηχεια)|το studio audio) [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
    - "((άναψε|αναψε)|(ανάψε|αναψε)|(άνοιξε|ανοιξε)|(ανοίξε|ανοιξε)|(ενεργοποίησε|ενεργοποιησε)) τον (ήχο|ηχο) (στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)"
  - trigger: conversation
    id: audio__off
    command:
    - "((κλείσε|κλεισε)|(σβήσε|σβησε)|(σβήσαι|σβησαι)|(σβήστε|σβηστε)|(απενεργοποίησε|απενεργοποιησε)) (τα (ηχεία|ηχεια)|τα krk|την (κονσόλα|κονσολα) και τα (ηχεία|ηχεια)|(κονσόλα|κονσολα) και (ηχεία|ηχεια)|το studio audio) [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
    - "((κλείσε|κλεισε)|(σβήσε|σβησε)|(σβήσαι|σβησαι)|(σβήστε|σβηστε)|(απενεργοποίησε|απενεργοποιησε)) τον (ήχο|ηχο) (στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)"
  - trigger: conversation
    id: amp__on
    command:
    - "((άναψε|αναψε)|(ανάψε|αναψε)|(άνοιξε|ανοιξε)|(ανοίξε|ανοιξε)|(ενεργοποίησε|ενεργοποιησε)) (τον (ενισχυτή|ενισχυτη) [(κιθάρας|κιθαρας)]|τον (κιθαριστικό|κιθαριστικο) (ενισχυτή|ενισχυτη)|τον ((μάρσαλ|μαρσαλ)|marshal|marshall)|την (κιθάρα|κιθαρα)) [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: amp__off
    command:
    - "((κλείσε|κλεισε)|(σβήσε|σβησε)|(σβήσαι|σβησαι)|(σβήστε|σβηστε)|(απενεργοποίησε|απενεργοποιησε)) (τον (ενισχυτή|ενισχυτη) [(κιθάρας|κιθαρας)]|τον (κιθαριστικό|κιθαριστικο) (ενισχυτή|ενισχυτη)|τον ((μάρσαλ|μαρσαλ)|marshal|marshall)|την (κιθάρα|κιθαρα)) [(στο|του|στον) ((στούντιο|στουντιο)|studio|pink radio)]"
  - trigger: conversation
    id: studio__on
    command:
    - "((ετοίμασε|ετοιμασε)|(ετοιμάσε|ετοιμασε)|(ετοίμασέ|ετοιμασε)) [(όλο|ολο) ]το ((στούντιο|στουντιο)|studio|pink radio)"
    - "((άναψε|αναψε)|(ανάψε|αναψε)|(άνοιξε|ανοιξε)|(ανοίξε|ανοιξε)|(ενεργοποίησε|ενεργοποιησε)) [(όλο|ολο) ]το ((στούντιο|στουντιο)|studio)"
  - trigger: conversation
    id: studio__off
    command:
    - "((κλείσε|κλεισε)|(σβήσε|σβησε)|(σβήσαι|σβησαι)|(σβήστε|σβηστε)|(απενεργοποίησε|απενεργοποιησε)) [(όλο|ολο) ]το ((στούντιο|στουντιο)|studio|pink radio)"
  conditions: []
  actions:
  - alias: 'Guard: μόνο από το studio ή το σαλόνι'
    if:
    - condition: template
      value_template: '{% set d = trigger.device_id | default(none) %}

        {% set a = area_id(d) if d else none %}

        {{ d is not none and not (a in [''pinkradio_studio'', ''living_room''] or floor_id(d) == ''pinkradio'') }}'
    then:
    - set_conversation_response: Αυτό γίνεται μόνο από το studio ή το σαλόνι.
    - stop: Εκτός scope (pinkradio)
  - variables:
      target: '{{ trigger.id.split(''__'')[0] }}'
      turn_on: '{{ trigger.id.split(''__'')[1] == ''on'' }}'
      switches:
        neon_onair: switch.pinkradio_neon_onair
        neon_logo: switch.pinkradio_neon_logo
        anarchy: switch.pinkradio_neon_anarchy
        thunder: switch.pinkradio_neon_thunder
        console: switch.pinkradio_onyx_console
        krk_left: switch.pinkradio_krk_left
        krk_right: switch.pinkradio_krk_right
        amp: switch.pinkradio_guitar_amp
      names:
        neon_all: τα neon
        neon_onair: το ON AIR
        neon_logo: το neon Pink Radio
        anarchy: το Anarchy
        thunder: το Thunder
        console: την κονσόλα
        krk_left: το αριστερό KRK
        krk_right: το δεξί KRK
        audio: την κονσόλα και τα ηχεία
        amp: τον ενισχυτή κιθάρας
  - choose:
    - conditions: '{{ target == ''studio'' }}'
      sequence:
      - action: script.pinkradio_studio_control
        data:
          studio_action: '{{ ''prepare'' if turn_on else ''off'' }}'
      - set_conversation_response: '{{ ''Το studio είναι έτοιμο.'' if turn_on else ''Έκλεισα το studio.'' }}'
    - conditions: '{{ target == ''neon_all'' }}'
      sequence:
      - action: script.pinkradio_neon_control
        data:
          action: '{{ ''on'' if turn_on else ''off'' }}'
    - conditions: '{{ target == ''audio'' }}'
      sequence:
      - action: script.pinkradio_studio_audio_control
        data:
          action: '{{ ''on'' if turn_on else ''off'' }}'
    - conditions: '{{ target in switches }}'
      sequence:
      - action: '{{ ''switch.turn_on'' if turn_on else ''switch.turn_off'' }}'
        target:
          entity_id: '{{ switches[target] }}'
  - if: '{{ target != ''studio'' }}'
    then:
    - set_conversation_response: '{{ (''Άναψα '' if turn_on else ''Έκλεισα '') ~ names.get(target, target) ~ ''.'' }}'
script:
  pinkradio_neon_control:
    alias: Pink Radio - Neon Control
    mode: single
    fields:
      action:
        required: true
        selector:
          select:
            options:
            - 'on'
            - 'off'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ action == ''on'' }}'
        sequence:
        - action: switch.turn_on
          target:
            entity_id:
            - switch.pinkradio_neon_onair
            - switch.pinkradio_neon_anarchy
            - switch.pinkradio_neon_thunder
            - switch.pinkradio_neon_logo
      - conditions:
        - condition: template
          value_template: '{{ action == ''off'' }}'
        sequence:
        - action: switch.turn_off
          target:
            entity_id:
            - switch.pinkradio_neon_onair
            - switch.pinkradio_neon_anarchy
            - switch.pinkradio_neon_thunder
            - switch.pinkradio_neon_logo
    description: ''
  pinkradio_studio_audio_control:
    alias: Pink Radio - Studio Audio Control
    mode: single
    fields:
      action:
        required: true
        selector:
          select:
            options:
            - 'on'
            - 'off'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ action == ''on'' }}'
        sequence:
        - action: switch.turn_on
          target:
            entity_id:
            - switch.pinkradio_onyx_console
            - switch.pinkradio_krk_left
            - switch.pinkradio_krk_right
      - conditions:
        - condition: template
          value_template: '{{ action == ''off'' }}'
        sequence:
        - action: switch.turn_off
          target:
            entity_id:
            - switch.pinkradio_onyx_console
            - switch.pinkradio_krk_left
            - switch.pinkradio_krk_right
  pinkradio_studio_control:
    alias: Pink Radio - Studio Control
    description: Κεντρικός έλεγχος προετοιμασίας και κλεισίματος του Pink Radio studio
    mode: single
    fields:
      studio_action:
        name: Action
        required: true
        selector:
          select:
            options:
            - prepare
            - 'off'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ studio_action == ''prepare'' }}'
        sequence:
        - action: script.pinkradio_studio_audio_control
          data:
            action: 'on'
        - action: script.pinkradio_neon_control
          data:
            action: 'on'
        - action: light.turn_on
          target:
            entity_id:
            - light.pinkradio_led_main
          data:
            rgb_color:
            - 226
            - 100
            - 216
            brightness_pct: 70
      - conditions:
        - condition: template
          value_template: '{{ studio_action == ''off'' }}'
        sequence:
        - action: light.turn_off
          target:
            entity_id:
            - light.pinkradio_led_main
        - action: script.pinkradio_neon_control
          data:
            action: 'off'
        - action: script.pinkradio_studio_audio_control
          data:
            action: 'off'
