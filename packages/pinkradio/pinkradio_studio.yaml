          data:
            action: 'off'
        - set_conversation_response: Έκλεισα τον ήχο στο studio.
      - conditions:
        - condition: trigger
          id: prepare
        sequence:
        - action: script.pink_radio_studio_control
          data:
            studio_action: prepare
        - set_conversation_response: Το studio είναι έτοιμο.
      - conditions:
        - condition: trigger
          id: studio_off
        sequence:
        - action: script.pink_radio_studio_control
          data:
            studio_action: 'off'
        - set_conversation_response: Έκλεισα το studio.
    mode: single
  - id: '1790453241879'
    alias: Voice - Guitar Amp ON/OFF
    description: Φωνητικός έλεγχος ενισχυτή κιθάρας Pink Radio
    triggers:
    - trigger: conversation
      command:
      - άναψε τον ενισχυτή
      - άνοιξε τον ενισχυτή
      - άναψε τον ενισχυτή κιθάρας
      - άνοιξε τον ενισχυτή κιθάρας
      - άναψε τον κιθαριστικό ενισχυτή
      - άνοιξε τον κιθαριστικό ενισχυτή
      - άναψε τον μάρσαλ
      - άνοιξε τον μάρσαλ
      - άναψε τον marshal
      - άνοιξε τον marshal
      - άναψε την κιθάρα
      id: amp_on
    - trigger: conversation
      command:
      - κλείσε τον ενισχυτή
      - κλείσε τον ενισχυτή κιθάρας
      - κλείσε τον κιθαριστικό ενισχυτή
      - κλείσε τον μάρσαλ
      - κλείσε τον marshal
      - κλείσε την κιθάρα
      - σβήσε τον ενισχυτή
      - σβήστε τον ενισχυτή
      - σβήσε τον ενισχυτή κιθάρας
      - σβήσε τον κιθαριστικό ενισχυτή
      - σβήστε τον κιθαριστικό ενισχυτή
      - σβήσε τον μάρσαλ
      - σβήστε τον μάρσαλ
      - σβήσε τον marshal
      - σβήστε τον marshal
      - σβήσε την κιθάρα
      - σβήστε την κιθάρα
      id: amp_off
    actions:
    - alias: "Guard: μόνο από το studio ή το σαλόνι"
      if:
        - condition: template
          value_template: >-
            {% set d = trigger.device_id | default(none) %}
            {% set a = area_id(d) if d else none %}
            {{ d is not none and not (a in ['pinkradio_studio', 'living_room'] or floor_id(d) == 'pinkradio') }}
      then:
        - set_conversation_response: Αυτό γίνεται μόνο από το studio ή το σαλόνι.
        - stop: Εκτός scope (pinkradio)
    - choose:
      - conditions:
        - condition: trigger
          id: amp_on
        sequence:
        - action: switch.turn_on
          target:
            entity_id: switch.pinkradio_guitar_amp
        - set_conversation_response: Άναψα τον ενισχυτή κιθάρας.
      - conditions:
        - condition: trigger
          id: amp_off
        sequence:
        - action: switch.turn_off
          target:
            entity_id: switch.pinkradio_guitar_amp
        - set_conversation_response: Έκλεισα τον ενισχυτή κιθάρας.
    mode: single

script:
  pink_radio_neon_control:
    alias: Pink Radio - Neon Control
    mode: single
    fields:
      action:
        required: true
        selector:
          select:
            options:
            - 'on'
            - 'off'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ action == ''on'' }}'
        sequence:
        - action: switch.turn_on
          target:
            entity_id:
            - switch.pinkradio_neon_onair
            - switch.pinkradio_neon_anarchy
            - switch.pinkradio_neon_thunder
            - switch.pinkradio_neon_logo
      - conditions:
        - condition: template
          value_template: '{{ action == ''off'' }}'
        sequence:
        - action: switch.turn_off
          target:
            entity_id:
            - switch.pinkradio_neon_onair
            - switch.pinkradio_neon_anarchy
            - switch.pinkradio_neon_thunder
            - switch.pinkradio_neon_logo
    description: ''
  pink_radio_studio_audio_control:
    alias: Pink Radio - Studio Audio Control
    mode: single
    fields:
      action:
        required: true
        selector:
          select:
            options:
            - 'on'
            - 'off'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ action == ''on'' }}'
        sequence:
        - action: switch.turn_on
          target:
            entity_id:
            - switch.pinkradio_onyx_console
            - switch.pinkradio_krk_left
            - switch.pinkradio_krk_right
      - conditions:
        - condition: template
          value_template: '{{ action == ''off'' }}'
        sequence:
        - action: switch.turn_off
          target:
            entity_id:
            - switch.pinkradio_onyx_console
            - switch.pinkradio_krk_left
            - switch.pinkradio_krk_right
  pink_radio_studio_control:
    alias: Pink Radio - Studio Control
    description: Κεντρικός έλεγχος προετοιμασίας και κλεισίματος του Pink Radio studio
    mode: single
    fields:
      studio_action:
        name: Action
        required: true
        selector:
          select:
            options:
            - prepare
            - 'off'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ studio_action == ''prepare'' }}'
        sequence:
        - action: script.pink_radio_studio_audio_control
          data:
            action: 'on'
        - action: script.pink_radio_neon_control
          data:
            action: 'on'
        - action: light.turn_on
          target:
            entity_id:
            - light.pinkradio_led_main
          data:
            rgb_color:
            - 226
            - 100
            - 216
            brightness_pct: 70
      - conditions:
        - condition: template
          value_template: '{{ studio_action == ''off'' }}'
        sequence:
        - action: light.turn_off
          target:
            entity_id:
            - light.pinkradio_led_main
        - action: script.pink_radio_neon_control
          data:
            action: 'off'
        - action: script.pink_radio_studio_audio_control
          data:
            action: 'off'
