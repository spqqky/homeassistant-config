# packages/pinkradio/pinkradio_studio.yaml (scope: pinkradio, βήμα 8α)
#
# «άναψε/κλείσε <συσκευή> [στο στούντιο]». Ένα trigger id ανά συσκευή και κατάσταση: <target>__on / <target>__off.
# Παραλλαγές inline (οι λίστες του custom_sentences ΔΕΝ λειτουργούν στα triggers).
# «τον ήχο» θέλει πάντα «στο στούντιο», για να μην κλείνει το studio όταν στο σαλόνι εννοείς την TV.
# Πρίζες: plug1 KRK αριστερό · plug2 ON AIR · plug3 Anarchy · plug4 Thunder · plug5 Pink Radio (logo)
#         plug6 κονσόλα Onyx · plug7 KRK δεξί · plug8 ενισχυτής κιθάρας

automation:
- id: pinkradio_voice_studio
  alias: Pink Radio - Voice Studio
  description: Neon (όλα ή ένα-ένα), κονσόλα, KRK, ήχος, ενισχυτής, άνοιγμα/κλείσιμο studio.
  mode: queued
  max: 5
  triggers:
  - trigger: conversation
    id: neon_all__on
    command:
    - (άναψε|ανάψε|άνοιξε|ανοίξε|ενεργοποίησε) [όλα ](τα|τις) (neon|νέον|νέων|νεον|πινακίδες|ταμπέλες) [(στο|του|στον) (στούντιο|studio|pink radio)]
  - trigger: conversation
    id: neon_all__off
    command:
    - (κλείσε|σβήσε|σβήσαι|σβήστε|απενεργοποίησε) [όλα ](τα|τις) (neon|νέον|νέων|νεον|πινακίδες|ταμπέλες) [(στο|του|στον) (στούντιο|studio|pink radio)]
  - trigger: conversation
    id: neon_onair__on
    command:
    - (άναψε|ανάψε|άνοιξε|ανοίξε|ενεργοποίησε) το (on air|ον έαρ|ον αιρ|όν έρ) [(neon|νέον)] [(στο|του|στον) (στούντιο|studio|pink radio)]
  - trigger: conversation
    id: neon_onair__off
    command:
    - (κλείσε|σβήσε|σβήσαι|σβήστε|απενεργοποίησε) το (on air|ον έαρ|ον αιρ|όν έρ) [(neon|νέον)] [(στο|του|στον) (στούντιο|studio|pink radio)]
  - trigger: conversation
    id: neon_logo__on
    command:
    - (άναψε|ανάψε|άνοιξε|ανοίξε|ενεργοποίησε) (το neon pink radio|το νέον pink radio|το pink radio neon|το pink radio νέον|το λογότυπο|το logo) [(στο|του|στον) (στούντιο|studio|pink
      radio)]
  - trigger: conversation
    id: neon_logo__off
    command:
    - (κλείσε|σβήσε|σβήσαι|σβήστε|απενεργοποίησε) (το neon pink radio|το νέον pink radio|το pink radio neon|το pink radio νέον|το λογότυπο|το logo) [(στο|του|στον)
      (στούντιο|studio|pink radio)]
  - trigger: conversation
    id: anarchy__on
    command:
    - (άναψε|ανάψε|άνοιξε|ανοίξε|ενεργοποίησε) (το|την) (anarchy|αναρχία|ανάρκι) [(neon|νέον)] [(στο|του|στον) (στούντιο|studio|pink radio)]
  - trigger: conversation
    id: anarchy__off
    command:
    - (κλείσε|σβήσε|σβήσαι|σβήστε|απενεργοποίησε) (το|την) (anarchy|αναρχία|ανάρκι) [(neon|νέον)] [(στο|του|στον) (στούντιο|studio|pink radio)]
  - trigger: conversation
    id: thunder__on
    command:
    - (άναψε|ανάψε|άνοιξε|ανοίξε|ενεργοποίησε) (το|τον) (thunder|θάντερ|κεραυνό) [(neon|νέον)] [(στο|του|στον) (στούντιο|studio|pink radio)]
  - trigger: conversation
    id: thunder__off
    command:
    - (κλείσε|σβήσε|σβήσαι|σβήστε|απενεργοποίησε) (το|τον) (thunder|θάντερ|κεραυνό) [(neon|νέον)] [(στο|του|στον) (στούντιο|studio|pink radio)]
  - trigger: conversation
    id: console__on
    command:
    - (άναψε|ανάψε|άνοιξε|ανοίξε|ενεργοποίησε) (την κονσόλα|το μίξερ|την onyx|το onyx) [(στο|του|στον) (στούντιο|studio|pink radio)]
  - trigger: conversation
    id: console__off
    command:
    - (κλείσε|σβήσε|σβήσαι|σβήστε|απενεργοποίησε) (την κονσόλα|το μίξερ|την onyx|το onyx) [(στο|του|στον) (στούντιο|studio|pink radio)]
  - trigger: conversation
    id: krk_left__on
    command:
    - (άναψε|ανάψε|άνοιξε|ανοίξε|ενεργοποίησε) (το αριστερό (ηχείο|krk)|το krk αριστερό) [(στο|του|στον) (στούντιο|studio|pink radio)]
  - trigger: conversation
    id: krk_left__off
    command:
    - (κλείσε|σβήσε|σβήσαι|σβήστε|απενεργοποίησε) (το αριστερό (ηχείο|krk)|το krk αριστερό) [(στο|του|στον) (στούντιο|studio|pink radio)]
  - trigger: conversation
    id: krk_right__on
    command:
    - (άναψε|ανάψε|άνοιξε|ανοίξε|ενεργοποίησε) (το δεξί (ηχείο|krk)|το krk δεξί) [(στο|του|στον) (στούντιο|studio|pink radio)]
  - trigger: conversation
    id: krk_right__off
    command:
    - (κλείσε|σβήσε|σβήσαι|σβήστε|απενεργοποίησε) (το δεξί (ηχείο|krk)|το krk δεξί) [(στο|του|στον) (στούντιο|studio|pink radio)]
  - trigger: conversation
    id: audio__on
    command:
    - (άναψε|ανάψε|άνοιξε|ανοίξε|ενεργοποίησε) (τα ηχεία|τα krk|την κονσόλα και τα ηχεία|κονσόλα και ηχεία|το studio audio) [(στο|του|στον) (στούντιο|studio|pink radio)]
    - (άναψε|ανάψε|άνοιξε|ανοίξε|ενεργοποίησε) τον ήχο (στο|του|στον) (στούντιο|studio|pink radio)
  - trigger: conversation
    id: audio__off
    command:
    - (κλείσε|σβήσε|σβήσαι|σβήστε|απενεργοποίησε) (τα ηχεία|τα krk|την κονσόλα και τα ηχεία|κονσόλα και ηχεία|το studio audio) [(στο|του|στον) (στούντιο|studio|pink radio)]
    - (κλείσε|σβήσε|σβήσαι|σβήστε|απενεργοποίησε) τον ήχο (στο|του|στον) (στούντιο|studio|pink radio)
  - trigger: conversation
    id: amp__on
    command:
    - (άναψε|ανάψε|άνοιξε|ανοίξε|ενεργοποίησε) (τον ενισχυτή [κιθάρας]|τον κιθαριστικό ενισχυτή|τον (μάρσαλ|marshal|marshall)|την κιθάρα) [(στο|του|στον) (στούντιο|studio|pink
      radio)]
  - trigger: conversation
    id: amp__off
    command:
    - (κλείσε|σβήσε|σβήσαι|σβήστε|απενεργοποίησε) (τον ενισχυτή [κιθάρας]|τον κιθαριστικό ενισχυτή|τον (μάρσαλ|marshal|marshall)|την κιθάρα) [(στο|του|στον) (στούντιο|studio|pink
      radio)]
  - trigger: conversation
    id: studio__on
    command:
    - (ετοίμασε|ετοιμάσε|ετοίμασέ) [όλο ]το (στούντιο|studio|pink radio)
    - (άναψε|ανάψε|άνοιξε|ανοίξε|ενεργοποίησε) [όλο ]το (στούντιο|studio)
  - trigger: conversation
    id: studio__off
    command:
    - (κλείσε|σβήσε|σβήσαι|σβήστε|απενεργοποίησε) [όλο ]το (στούντιο|studio|pink radio)
  conditions: []
  actions:
  - alias: 'Guard: μόνο από το studio ή το σαλόνι'
    if:
    - condition: template
      value_template: '{% set d = trigger.device_id | default(none) %}

        {% set a = area_id(d) if d else none %}

        {{ d is not none and not (a in [''pinkradio_studio'', ''living_room''] or floor_id(d) == ''pinkradio'') }}'
    then:
    - set_conversation_response: Αυτό γίνεται μόνο από το studio ή το σαλόνι.
    - stop: Εκτός scope (pinkradio)
  - variables:
      target: '{{ trigger.id.split(''__'')[0] }}'
      turn_on: '{{ trigger.id.split(''__'')[1] == ''on'' }}'
      switches:
        neon_onair: switch.pinkradio_neon_onair
        neon_logo: switch.pinkradio_neon_logo
        anarchy: switch.pinkradio_neon_anarchy
        thunder: switch.pinkradio_neon_thunder
        console: switch.pinkradio_onyx_console
        krk_left: switch.pinkradio_krk_left
        krk_right: switch.pinkradio_krk_right
        amp: switch.pinkradio_guitar_amp
      names:
        neon_all: τα neon
        neon_onair: το ON AIR
        neon_logo: το neon Pink Radio
        anarchy: το Anarchy
        thunder: το Thunder
        console: την κονσόλα
        krk_left: το αριστερό KRK
        krk_right: το δεξί KRK
        audio: την κονσόλα και τα ηχεία
        amp: τον ενισχυτή κιθάρας
  - choose:
    - conditions: '{{ target == ''studio'' }}'
      sequence:
      - action: script.pinkradio_studio_control
        data:
          studio_action: '{{ ''prepare'' if turn_on else ''off'' }}'
      - set_conversation_response: '{{ ''Το studio είναι έτοιμο.'' if turn_on else ''Έκλεισα το studio.'' }}'
    - conditions: '{{ target == ''neon_all'' }}'
      sequence:
      - action: script.pinkradio_neon_control
        data:
          action: '{{ ''on'' if turn_on else ''off'' }}'
    - conditions: '{{ target == ''audio'' }}'
      sequence:
      - action: script.pinkradio_studio_audio_control
        data:
          action: '{{ ''on'' if turn_on else ''off'' }}'
    - conditions: '{{ target in switches }}'
      sequence:
      - action: '{{ ''switch.turn_on'' if turn_on else ''switch.turn_off'' }}'
        target:
          entity_id: '{{ switches[target] }}'
  - if: '{{ target != ''studio'' }}'
    then:
    - set_conversation_response: '{{ (''Άναψα '' if turn_on else ''Έκλεισα '') ~ names.get(target, target) ~ ''.'' }}'
script:
  pinkradio_neon_control:
    alias: Pink Radio - Neon Control
    mode: single
    fields:
      action:
        required: true
        selector:
          select:
            options:
            - 'on'
            - 'off'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ action == ''on'' }}'
        sequence:
        - action: switch.turn_on
          target:
            entity_id:
            - switch.pinkradio_neon_onair
            - switch.pinkradio_neon_anarchy
            - switch.pinkradio_neon_thunder
            - switch.pinkradio_neon_logo
      - conditions:
        - condition: template
          value_template: '{{ action == ''off'' }}'
        sequence:
        - action: switch.turn_off
          target:
            entity_id:
            - switch.pinkradio_neon_onair
            - switch.pinkradio_neon_anarchy
            - switch.pinkradio_neon_thunder
            - switch.pinkradio_neon_logo
    description: ''
  pinkradio_studio_audio_control:
    alias: Pink Radio - Studio Audio Control
    mode: single
    fields:
      action:
        required: true
        selector:
          select:
            options:
            - 'on'
            - 'off'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ action == ''on'' }}'
        sequence:
        - action: switch.turn_on
          target:
            entity_id:
            - switch.pinkradio_onyx_console
            - switch.pinkradio_krk_left
            - switch.pinkradio_krk_right
      - conditions:
        - condition: template
          value_template: '{{ action == ''off'' }}'
        sequence:
        - action: switch.turn_off
          target:
            entity_id:
            - switch.pinkradio_onyx_console
            - switch.pinkradio_krk_left
            - switch.pinkradio_krk_right
  pinkradio_studio_control:
    alias: Pink Radio - Studio Control
    description: Κεντρικός έλεγχος προετοιμασίας και κλεισίματος του Pink Radio studio
    mode: single
    fields:
      studio_action:
        name: Action
        required: true
        selector:
          select:
            options:
            - prepare
            - 'off'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ studio_action == ''prepare'' }}'
        sequence:
        - action: script.pinkradio_studio_audio_control
          data:
            action: 'on'
        - action: script.pinkradio_neon_control
          data:
            action: 'on'
        - action: light.turn_on
          target:
            entity_id:
            - light.pinkradio_led_main
          data:
            rgb_color:
            - 226
            - 100
            - 216
            brightness_pct: 70
      - conditions:
        - condition: template
          value_template: '{{ studio_action == ''off'' }}'
        sequence:
        - action: light.turn_off
          target:
            entity_id:
            - light.pinkradio_led_main
        - action: script.pinkradio_neon_control
          data:
            action: 'off'
        - action: script.pinkradio_studio_audio_control
          data:
            action: 'off'
