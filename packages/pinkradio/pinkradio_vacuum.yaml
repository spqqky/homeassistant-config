# packages/pinkradio/pinkradio_vacuum.yaml (scope: pinkradio, βήμα 8γ)
#
# Σκούπα studio (Xiaomi S20) → vacuum.pinkradio_vacuum
# - script.pinkradio_vacuum_clean(mode): όλη η λογική καθαρισμού του studio.
# - Οι φωνητικές εντολές είναι στο shared/shared_vacuum.yaml (κοινές με τη σκούπα του σπιτιού,
#   με επιλογή σκούπας ανά χώρο).

script:
  pinkradio_vacuum_clean:
    alias: Pink Radio - Vacuum Clean
    description: >-
      Καθαρισμός studio. mode = normal (Basic) | strong | quiet | mop (μόνο σφουγγάρισμα) | sweep_mop.
    mode: single
    icon: mdi:robot-vacuum
    fields:
      mode:
        name: Mode
        default: normal
        selector:
          select:
            options:
              - normal
              - strong
              - quiet
              - mop
              - sweep_mop
    variables:
      clean_mode: "{{ mode if (mode is defined and mode) else 'normal' }}"
      fan: "{{ {'strong': 'Strong', 'quiet': 'Silent'}.get(clean_mode, 'Basic') }}"
    sequence:
      - choose:
          - conditions: "{{ clean_mode == 'mop' }}"
            sequence:
              - action: select.select_option
                target:
                  entity_id: select.pinkradio_vacuum_mode
                data:
                  option: Mop
              - action: button.press
                target:
                  entity_id: button.pinkradio_vacuum_start_mop
          - conditions: "{{ clean_mode == 'sweep_mop' }}"
            sequence:
              - action: button.press
                target:
                  entity_id: button.pinkradio_vacuum_start_sweep_mop
        default:
          - action: select.select_option
            target:
              entity_id: select.pinkradio_vacuum_mode
            data:
              option: Sweep
          - action: vacuum.set_fan_speed
            continue_on_error: true
            target:
              entity_id: vacuum.pinkradio_vacuum
            data:
              fan_speed: "{{ fan }}"
          - action: button.press
            target:
              entity_id: button.pinkradio_vacuum_start_only_sweep
