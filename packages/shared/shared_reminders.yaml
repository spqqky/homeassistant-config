# packages/shared/shared_reminders.yaml (scope: shared, βήμα 11 – Reminders v2)
#
# Δεδομένα: calendar.reminders, μέσω της custom integration reminder_manager (create/find/update/delete).
# Κάθε ειδοποίηση είναι ένα event στο ημερολόγιο τη στιγμή που πρέπει να ειδοποιήσει. Η περιγραφή του
# κρατά παραλήπτες, «πριν», επανάληψη και id (βλ. custom_components/reminder_manager/__init__.py).
#
# Scripts = εργαλεία του Gemini (exposed): Reminder - Create / Find / Update / Delete.
# Automation «Reminders - Notify»: στην ώρα της ειδοποίησης → push στο κινητό + φωνή στο ηχείο του δωματίου
# κάθε παραλήπτη. Ήσυχες ώρες 22:00–08:00: μόνο push.

automation:
- id: shared_reminders_notify
  alias: Reminders - Notify
  description: Ειδοποίηση υπενθύμισης στους παραλήπτες της (κινητό + ηχείο δωματίου).
  mode: queued
  max: 20
  triggers:
  - trigger: calendar
    entity_id: calendar.reminders
    event: start
    offset: "0:00:00"
  conditions: []
  actions:
  - variables:
      # Παραλήπτης → κινητό (notify entity, κενό = χωρίς push ακόμα) και χώρος για το ηχείο (script.voice_speak)
      people:
        chris: {notify: notify.chris_smartphone, area: living_room}
        nefeli: {notify: "", area: nefeli_room}
        alex: {notify: "", area: alex_room}
      desc: "{{ trigger.calendar_event.description | default('') }}"
      text: "{{ trigger.calendar_event.summary }}"
      recipients: >-
        {% set m = desc | regex_findall('για:\\s*([a-z,\\s]+)') %}
        {{ (m[0].split(',') | map('trim') | reject('eq', '') | list) if m else ['chris'] }}
      before: >-
        {% set m = desc | regex_findall('πριν:\\s*(\\d+)') or desc | regex_findall('Υπενθύμιση\\s+(\\d+)\\s+λεπτά πριν') %}
        {{ m[0] | int if m else 0 }}
      when_text: >-
        {%- set b = before | int -%}
        {%- if b == 0 -%}
        {%- elif b == 1440 -%}αύριο αυτή την ώρα
        {%- elif b % 1440 == 0 -%}σε {{ (b / 1440) | int }} μέρες
        {%- elif b == 60 -%}σε μία ώρα
        {%- elif b % 60 == 0 -%}σε {{ (b / 60) | int }} ώρες
        {%- else -%}σε {{ b }} λεπτά{%- endif -%}
      message: "{{ ('Υπενθύμιση: ' ~ text ~ '.') if when_text == '' else ('Υπενθύμιση, ' ~ when_text ~ ': ' ~ text ~ '.') }}"
      quiet: "{{ now().hour >= 22 or now().hour < 8 }}"
  - repeat:
      for_each: "{{ recipients }}"
      sequence:
      - variables:
          p: "{{ people.get(repeat.item, {}) }}"
      - if: "{{ p.get('notify', '') != '' }}"
        then:
        - action: notify.send_message
          continue_on_error: true
          target:
            entity_id: "{{ p.notify }}"
          data:
            title: Υπενθύμιση
            message: "{{ message }}"
      - if: "{{ p.get('area', '') != '' and not quiet }}"
        then:
        - action: script.voice_speak
          continue_on_error: true
          data:
            message: "{{ message }}"
            area: "{{ p.area }}"

script:
  reminder_create:
    alias: Reminder - Create
    description: >-
      Create a reminder. Convert Greek date/time to event_datetime "YYYY-MM-DD HH:MM" (Europe/Athens).
      minutes_before: notification offsets in minutes before the event, comma separated (e.g. "1440,60"); "0" if none said.
      recipients: comma separated from chris, nefeli, alex (Χρήστος=chris, Νεφέλη=nefeli, Αλεξάνδρα=alex); default chris.
      repeat: none|daily|weekly|weekdays|monthly|yearly; for weekly on specific days set days (MO,TU,WE,TH,FR,SA,SU).
      Confirm only if status is created.
    mode: queued
    icon: mdi:bell-plus
    fields:
      reminder_text:
        name: Κείμενο
        required: true
        selector:
          text:
      event_datetime:
        name: Ώρα γεγονότος (YYYY-MM-DD HH:MM)
        required: true
        selector:
          text:
      minutes_before:
        name: Λεπτά πριν (με κόμμα)
        default: "0"
        selector:
          text:
      recipients:
        name: Παραλήπτες (chris, nefeli, alex)
        default: chris
        selector:
          text:
      repeat:
        name: Επανάληψη
        default: none
        selector:
          select:
            options: [none, daily, weekly, weekdays, monthly, yearly]
      days:
        name: Μέρες (για weekly)
        selector:
          text:
    sequence:
    - action: reminder_manager.create_reminder
      data:
        text: "{{ reminder_text }}"
        event_datetime: "{{ event_datetime }}"
        before: "{{ minutes_before | default('0', true) | string }}"
        recipients: "{{ recipients | default('chris', true) | string }}"
        repeat: "{{ repeat | default('none', true) }}"
        days: "{{ days | default('', true) | string }}"
      response_variable: result
    - stop: done
      response_variable: result

  reminder_find:
    alias: Reminder - Find
    description: >-
      Find upcoming reminders. ALWAYS use this before answering about existing reminders and before update/delete.
      search_text: subject keyword (empty = all). Returns event_datetime (the real appointment time), minutes_before,
      recipients and repeat for each reminder.
    mode: parallel
    icon: mdi:bell-search
    fields:
      search_text:
        name: Αναζήτηση
        default: ""
        selector:
          text:
    sequence:
    - action: reminder_manager.find_reminders
      data:
        search_text: "{{ search_text | default('', true) }}"
      response_variable: result
    - stop: done
      response_variable: result

  reminder_update:
    alias: Reminder - Update
    description: >-
      Change ONE existing reminder (move time, rename, change notifications, recipients or repeat). Only fill the
      new_* fields that change. status: updated → confirm; not_found / multiple_matches (ask which) / invalid / error → explain.
    mode: queued
    icon: mdi:bell-cog
    fields:
      search_text:
        name: Ποια υπενθύμιση
        required: true
        selector:
          text:
      event_date:
        name: Ημερομηνία γεγονότος (YYYY-MM-DD), αν χρειάζεται
        selector:
          text:
      new_event_datetime:
        name: Νέα ώρα (YYYY-MM-DD HH:MM)
        selector:
          text:
      new_text:
        name: Νέο κείμενο
        selector:
          text:
      new_minutes_before:
        name: Νέα λεπτά πριν
        selector:
          text:
      new_recipients:
        name: Νέοι παραλήπτες
        selector:
          text:
      new_repeat:
        name: Νέα επανάληψη
        selector:
          select:
            options: [none, daily, weekly, weekdays, monthly, yearly]
      new_days:
        name: Νέες μέρες
        selector:
          text:
    sequence:
    - action: reminder_manager.update_reminder
      data:
        search_text: "{{ search_text }}"
        event_date: "{{ event_date | default('', true) }}"
        new_text: "{{ new_text | default('', true) }}"
        new_event_datetime: "{{ new_event_datetime | default('', true) }}"
        new_before: "{{ new_minutes_before | default('', true) | string }}"
        new_recipients: "{{ new_recipients | default('', true) | string }}"
        new_repeat: "{{ new_repeat | default('', true) }}"
        new_days: "{{ new_days | default('', true) | string }}"
      response_variable: result
    - stop: done
      response_variable: result

  reminder_delete:
    alias: Reminder - Delete
    description: >-
      Delete ONE reminder, only when explicitly asked. Deletes all its notifications (and the whole series if recurring).
      status: deleted → confirm; not_found; multiple_matches → describe them and ask which; invalid; error.
    mode: queued
    icon: mdi:bell-remove
    fields:
      search_text:
        name: Ποια υπενθύμιση
        required: true
        selector:
          text:
      event_date:
        name: Ημερομηνία γεγονότος (YYYY-MM-DD), αν χρειάζεται
        selector:
          text:
    sequence:
    - action: reminder_manager.delete_reminder
      data:
        search_text: "{{ search_text }}"
        event_date: "{{ event_date | default('', true) }}"
      response_variable: result
    - stop: done
      response_variable: result
