# packages/home/home_media.yaml (scope: home)
# Μεταφέρθηκε αυτούσιο από automations.yaml/scripts.yaml στο βήμα 2β. Επεξεργασία μόνο εδώ, όχι από το UI.

automation:
  - id: '1790339596864'
    alias: Voice - Music Assistant
    description: ''
    triggers:
    - trigger: conversation
      command:
      - "(παίξε|παιξε) {song} [στο ]JBL"
      - "(παίξε|παιξε) {song} [στο ](σαλόνι|σαλονι)"
      id: jbl
    - trigger: conversation
      command:
      - "(παίξε|παιξε) {song} [στη ](Νεφέλη|Νεφελη)"
      - "(παίξε|παιξε) {song} [στο ](δωμάτιο|δωματιο) της (Νεφέλης|Νεφελης)"
      id: nefeli
    - trigger: conversation
      command:
      - "(παίξε|παιξε) {song} [στην ](Αλεξάνδρα|Αλεξανδρα)"
      - "(παίξε|παιξε) {song} [στο ](δωμάτιο|δωματιο) της (Αλεξάνδρας|Αλεξανδρας)"
      id: alex
    - trigger: conversation
      command:
      - "(παίξε|παιξε) {song} [στη ]Sarah"
      - "(παίξε|παιξε) {song} [στη ](Σάρα|Σαρα)"
      - "(παίξε|παιξε) {song} [στο ](δωμάτιο|δωματιο) της Sarah"
      - "(παίξε|παιξε) {song} [στο ](δωμάτιο|δωματιο) της (Σάρας|Σαρας)"
      - "(παίξε|παιξε) {song} [στη ](κρεββατοκάμαρα|κρεββατοκαμαρα)"
      - "(παίξε|παιξε) {song} [στην ](κρεββατοκάμαρα|κρεββατοκαμαρα)"
      id: sarah
    - trigger: conversation
      command:
      - "(παίξε|παιξε) {song} [στη ](Νεφέλη|Νεφελη) και την (Αλεξάνδρα|Αλεξανδρα)"
      - "(παίξε|παιξε) {song} [στην ](Αλεξάνδρα|Αλεξανδρα) και τη (Νεφέλη|Νεφελη)"
      - "(παίξε|παιξε) {song} [στα ](δωμάτια|δωματια) της (Αλεξάνδρας|Αλεξανδρας) και της (Νεφέλης|Νεφελης)"
      - "(παίξε|παιξε) {song} [στα ](δωμάτια|δωματια) της (Νεφέλης|Νεφελης) και της (Αλεξάνδρας|Αλεξανδρας)"
      - "(παίξε|παιξε) {song} [στα ](παιδικά|παιδικα) (δωμάτια|δωματια)"
      - "(παίξε|παιξε) {song} [στα ](παιδιά|παιδια)"
      id: kids
    - trigger: conversation
      command:
      - "(παίξε|παιξε) {song} [σε ](όλους|ολους)"
      - "(παίξε|παιξε) {song} [σε ](όλα|ολα) τα (ηχεία|ηχεια)"
      - "(βάλε|βαλε) {song} [σε ](όλους|ολους)"
      id: all
    # Αν δύο triggers ταιριάζουν στην ίδια φράση, το HA εκτελεί και τα δύο. Εδώ κόβουμε όταν το {song} «έφαγε»
    # ραδιόφωνο (το χειρίζεται το «Voice - Radio») ή άλλον στόχο («… στη Νεφέλη και την Αλεξάνδρα» → μόνο kids).
    conditions:
      - condition: template
        value_template: >-
          {% set s = trigger.slots.song | default('') | lower %}
          {{ not (s is search('^(το |τον )?(σταθμ|ραδιοφων|ραδιόφων)'))
             and not (s is search('(στη|στην|στο|στα|σε)\\s+(νεφελ|νεφέλ|αλεξανδρ|αλεξάνδρ|σαρα|σάρα|σαλον|σαλόν|κρεβατ|κρεββατ|παιδ|ολους|όλους)'))
             and not (s is search('\\sκαι(\\s+(τη|την))?$')) }}
    actions:
    - alias: "Guard: μόνο από το floor home"
      if:
        - condition: template
          value_template: >-
            {% set d = trigger.device_id | default(none) %}
            {% set a = area_id(d) if d else none %}
            {{ d is not none and not (a in ['living_room', 'nefeli_room', 'alex_room', 'bedroom', 'office'] or floor_id(d) == 'home') }}
      then:
        - set_conversation_response: Αυτό γίνεται μόνο από το σπίτι.
        - stop: Εκτός scope (home)
    - choose:
      - conditions:
        - condition: trigger
          id: jbl
        sequence:
        - set_conversation_response: Παίζω {{ trigger.slots.song }} στο JBL.
        - action: music_assistant.play_media
          target:
            entity_id: media_player.home_living_room_speaker
          data:
            media_id: '{{ trigger.slots.song }}'
      - conditions:
        - condition: trigger
          id: nefeli
        sequence:
        - set_conversation_response: Παίζω {{ trigger.slots.song }} στο δωμάτιο της
            Νεφέλης.
        - action: music_assistant.play_media
          target:
            entity_id: media_player.home_nefeli_room_speaker
          data:
            media_id: '{{ trigger.slots.song }}'
      - conditions:
        - condition: trigger
          id: sarah
        sequence:
        - set_conversation_response: Παίζω {{ trigger.slots.song }} στο δωμάτιο της
            Σάρας.
        - action: music_assistant.play_media
          target:
            entity_id: media_player.home_bedroom_speaker
          data:
            media_id: '{{ trigger.slots.song }}'
      - conditions:
        - condition: trigger
          id: alex
        sequence:
        - set_conversation_response: Παίζω {{ trigger.slots.song }} στο δωμάτιο της
            Αλεξάνδρας.
        - action: music_assistant.play_media
          target:
            entity_id: media_player.home_alex_room_speaker
          data:
            media_id: '{{ trigger.slots.song }}'
      - conditions:
        - condition: trigger
          id: all
        sequence:
        - set_conversation_response: Παίζω {{ trigger.slots.song }} σε όλα τα ηχεία.
        - action: music_assistant.play_media
          target:
            entity_id:
            - media_player.oikiake_omada_2
          data:
            media_id: '{{ trigger.slots.song }}'
      - conditions:
        - condition: trigger
          id: kids
        sequence:
        - set_conversation_response: Παίζω {{ trigger.slots.song }} στα παιδικά δωμάτια.
        - action: music_assistant.play_media
          target:
            entity_id:
            - media_player.kids_2
          data:
            media_id: '{{ trigger.slots.song }}'
    mode: single
