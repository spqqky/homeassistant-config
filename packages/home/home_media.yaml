# packages/home/home_media.yaml (scope: home)
# Μεταφέρθηκε αυτούσιο από automations.yaml/scripts.yaml στο βήμα 2β. Επεξεργασία μόνο εδώ, όχι από το UI.

automation:
  - id: '1790339596864'
    alias: Voice - Music Assistant
    description: ''
    triggers:
    - trigger: conversation
      command:
      - παίξε {song} στο JBL
      - παίξε {song} στο σαλόνι
      id: jbl
    - trigger: conversation
      command:
      - παίξε {song} στη Νεφέλη
      - παίξε {song} στο δωμάτιο της Νεφέλης
      id: nefeli
    - trigger: conversation
      command:
      - παίξε {song} στην Αλεξάνδρα
      - παίξε {song} στο δωμάτιο της Αλεξάνδρας
      id: alex
    - trigger: conversation
      command:
      - παίξε {song} στη Sarah
      - παίξε {song} στη Σάρα
      - παίξε {song} στο δωμάτιο της Sarah
      - παίξε {song} στο δωμάτιο της Σάρας
      - παίξε {song} στη κρεββατοκάμαρα
      - παίξε {song} στην κρεββατοκάμαρα
      id: sarah
    - trigger: conversation
      command:
      - παίξε {song} στη Νεφέλη και την Αλεξάνδρα
      - παίξε {song} στην Αλεξάνδρα και τη Νεφέλη
      - παίξε {song} στα δωμάτια της Αλεξάνδρας και της Νεφέλης
      - παίξε {song} στα δωμάτια της Νεφέλης και της Αλεξάνδρας
      - παίξε {song} στα παιδικά δωμάτια
      - παίξε {song} στα παιδιά
      id: kids
    - trigger: conversation
      command:
      - παίξε {song} σε όλους
      - παίξε {song} σε όλα τα ηχεία
      - βάλε {song} σε όλους
      id: all
    conditions: []
    actions:
    - choose:
      - conditions:
        - condition: trigger
          id: jbl
        sequence:
        - set_conversation_response: Παίζω {{ trigger.slots.song }} στο JBL.
        - action: music_assistant.play_media
          target:
            entity_id: media_player.home_living_room_speaker
          data:
            media_id: '{{ trigger.slots.song }}'
      - conditions:
        - condition: trigger
          id: nefeli
        sequence:
        - set_conversation_response: Παίζω {{ trigger.slots.song }} στο δωμάτιο της
            Νεφέλης.
        - action: music_assistant.play_media
          target:
            entity_id: media_player.home_nefeli_room_speaker
          data:
            media_id: '{{ trigger.slots.song }}'
      - conditions:
        - condition: trigger
          id: sarah
        sequence:
        - set_conversation_response: Παίζω {{ trigger.slots.song }} στο δωμάτιο της
            Σάρας.
        - action: music_assistant.play_media
          target:
            entity_id: media_player.home_bedroom_speaker
          data:
            media_id: '{{ trigger.slots.song }}'
      - conditions:
        - condition: trigger
          id: alex
        sequence:
        - set_conversation_response: Παίζω {{ trigger.slots.song }} στο δωμάτιο της
            Αλεξάνδρας.
        - action: music_assistant.play_media
          target:
            entity_id: media_player.home_alex_room_speaker
          data:
            media_id: '{{ trigger.slots.song }}'
      - conditions:
        - condition: trigger
          id: all
        sequence:
        - set_conversation_response: Παίζω {{ trigger.slots.song }} σε όλα τα ηχεία.
        - action: music_assistant.play_media
          target:
            entity_id:
            - media_player.oikiake_omada_2
          data:
            media_id: '{{ trigger.slots.song }}'
      - conditions:
        - condition: trigger
          id: kids
        sequence:
        - set_conversation_response: Παίζω {{ trigger.slots.song }} στα παιδικά δωμάτια.
        - action: music_assistant.play_media
          target:
            entity_id:
            - media_player.kids_2
          data:
            media_id: '{{ trigger.slots.song }}'
    mode: single
