# packages/home/home_vacuum.yaml (scope: home, βήμα 7)
#
# Σκούπα σπιτιού (Xiaomi S20+, xiaomi.vacuum.b108gl) → vacuum.home_vacuum
#
# - script.home_vacuum_clean(rooms, mode): ΟΛΗ η λογική καθαρισμού, σε ένα σημείο.
# - automation «Home Vacuum - Voice Clean»: «σκούπισε / καθάρισε / σφουγγάρισε <δωμάτια>».
#   Mode από λέξεις-κλειδιά της φράσης, δωμάτια από λέξεις-κλειδιά (οποιοσδήποτε συνδυασμός).
# - automation «Home Vacuum - Voice Control»: start/stop/παύση/βάση/μπαταρία/κατάσταση.
# - Απαντήσεις ΜΟΝΟ με set_conversation_response (ακούγονται στο ηχείο του δωματίου της εντολής).
#
# Room IDs (χάρτης της σκούπας): 3 σαλόνι · 4 WC · 5 χολ · 7 Νεφέλη · 8 κρεβατοκάμαρα · 9 Αλεξάνδρα · 10 μπάνιο

script:
  home_vacuum_clean:
    alias: Home Vacuum - Clean
    description: >-
      Καθαρισμός με τη σκούπα του σπιτιού. rooms = λίστα room IDs (κενή = όλο το σπίτι).
      mode = normal (Basic) | strong | quiet | mop (σκούπισμα+σφουγγάρισμα, νερό Level2) | mop_wet (νερό Level3).
    mode: single
    icon: mdi:robot-vacuum
    fields:
      rooms:
        name: Δωμάτια (room IDs)
        description: "3 σαλόνι, 4 WC, 5 χολ, 7 Νεφέλη, 8 κρεβατοκάμαρα, 9 Αλεξάνδρα, 10 μπάνιο. Κενό = όλο το σπίτι."
        example: "[3, 5]"
        selector:
          object:
      mode:
        name: Mode
        default: normal
        selector:
          select:
            options:
              - normal
              - strong
              - quiet
              - mop
              - mop_wet
    variables:
      clean_mode: "{{ mode if (mode is defined and mode) else 'normal' }}"
      room_ids: "{{ rooms if (rooms is defined and rooms) else [] }}"
      fan: >-
        {{ {'strong': 'Strong', 'quiet': 'Silent'}.get(clean_mode, 'Basic') }}
      mopping: "{{ clean_mode in ['mop', 'mop_wet'] }}"
      water: "{{ 'Level3' if clean_mode == 'mop_wet' else 'Level2' }}"
    sequence:
      # 1. Τύπος καθαρισμού (σκούπισμα ή σκούπισμα+σφουγγάρισμα)
      - if: "{{ mopping }}"
        then:
          - action: xiaomi_miot.set_miot_property
            data:
              entity_id: vacuum.home_vacuum
              siid: 2
              piid: 3
              value: 3
          - action: select.select_option
            target:
              entity_id: select.home_vacuum_mop_water_output_level
            data:
              option: "{{ water }}"
        else:
          - action: select.select_option
            continue_on_error: true
            target:
              entity_id: select.home_vacuum_sweep_mop_type
            data:
              option: Sweep
      # 2. Ισχύς
      - action: vacuum.set_fan_speed
        continue_on_error: true
        target:
          entity_id: vacuum.home_vacuum
        data:
          fan_speed: "{{ fan }}"
      # 3. Εκκίνηση: δωμάτια ή όλο το σπίτι
      - if: "{{ room_ids | count > 0 }}"
        then:
          - action: xiaomi_miot.call_action
            data:
              entity_id: vacuum.home_vacuum
              siid: 2
              aiid: 13
              # λίστα με ΕΝΑ string JSON, π.χ. ['{"room": [3, 5]}'] (όχι dict, το xiaomi_miot θέλει κείμενο)
              params: "{{ [ {'room': room_ids | map('int') | list} | to_json ] }}"
        else:
          - if: "{{ mopping }}"
            then:
              - action: button.press
                target:
                  entity_id: button.home_vacuum_start_sweep_mop
            else:
              - action: vacuum.start
                target:
                  entity_id: vacuum.home_vacuum

automation:
  - id: home_vacuum_voice_clean
    alias: Home Vacuum - Voice Clean
    description: «σκούπισε / καθάρισε / σφουγγάρισε <δωμάτια>», με δυνατά / ήσυχα / με πολύ νερό.
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "(σκούπισε|καθάρισε|σφουγγάρισε) {rooms}"
          - "(σκούπισε|καθάρισε) και σφουγγάρισε {rooms}"
    conditions: []
    actions:
      - alias: "Guard: μόνο από το floor home"
        if:
          - condition: template
            value_template: >-
              {% set d = trigger.device_id | default(none) %}
              {% set a = area_id(d) if d else none %}
              {{ d is not none and not (a in ['living_room', 'nefeli_room', 'alex_room', 'bedroom', 'office'] or floor_id(d) == 'home') }}
        then:
          - set_conversation_response: Αυτό γίνεται μόνο από το σπίτι.
          - stop: Εκτός scope (home)
      - variables:
          text: "{{ trigger.sentence | lower }}"
          clean_mode: >-
            {% if 'σφουγγάρ' in text %}{{ 'mop_wet' if 'πολύ νερό' in text else 'mop' }}
            {% elif 'δυνατ' in text %}strong
            {% elif 'ήσυχ' in text or 'απαλ' in text %}quiet
            {% else %}normal{% endif %}
          # λέξη-κλειδί → (room IDs, όνομα για την απάντηση)
          room_ids: >-
            {% set ns = namespace(ids=[]) %}
            {% set kw = [
              ('σαλόν', [3]), ('χολ', [5]), ('χώλ', [5]), ('hall', [5]),
              ('νεφέλη', [7]), ('αλεξάνδρ', [9]), ('παιδικ', [7, 9]),
              ('κρεβατοκάμαρ', [8]), ('υπνοδωμάτι', [8]),
              ('μπάνιο', [10]),
              ('wc', [4]), ('βε σε', [4]), ('βεσέ', [4]), ('τουαλέτα', [4])
            ] %}
            {% for k, ids in kw %}{% if k in text %}{% set ns.ids = ns.ids + ids %}{% endif %}{% endfor %}
            {% if text is search('(^|\\s)w(\\s|$)') %}{% set ns.ids = ns.ids + [4] %}{% endif %}
            {{ ns.ids | unique | list }}
          whole_house: "{{ 'όλο το σπίτι' in text or 'παντού' in text }}"
          studio: "{{ 'στούντιο' in text or 'studio' in text or 'pink' in text }}"
      - if: "{{ studio }}"
        then:
          - set_conversation_response: Για τη σκούπα του studio πες «σκούπισε το στούντιο».
          - stop: Studio
      - if: "{{ not whole_house and room_ids | count == 0 }}"
        then:
          - set_conversation_response: >-
              Δεν κατάλαβα ποιο δωμάτιο. Πες για παράδειγμα «σκούπισε το σαλόνι» ή «σκούπισε όλο το σπίτι».
          - stop: Άγνωστο δωμάτιο
      - if: "{{ state_attr('vacuum.home_vacuum', 'battery_level') | int(0) < 20 }}"
        then:
          - set_conversation_response: >-
              Η μπαταρία της σκούπας είναι στο {{ state_attr('vacuum.home_vacuum', 'battery_level') | int(0) }}%.
              Άφησέ τη να φορτίσει λίγο πρώτα.
          - stop: Χαμηλή μπαταρία
      - action: script.home_vacuum_clean
        data:
          rooms: "{{ [] if whole_house else room_ids }}"
          mode: "{{ clean_mode | trim }}"
      - variables:
          names:
            3: στο σαλόνι
            4: στο WC
            5: στο χολ
            7: στο δωμάτιο της Νεφέλης
            8: στην κρεβατοκάμαρα
            9: στο δωμάτιο της Αλεξάνδρας
            10: στο μπάνιο
          mode_text:
            normal: Ξεκινάω σκούπισμα
            strong: Ξεκινάω δυνατό σκούπισμα
            quiet: Ξεκινάω ήσυχο σκούπισμα
            mop: Ξεκινάω σκούπισμα και σφουγγάρισμα
            mop_wet: Ξεκινάω σφουγγάρισμα με πολύ νερό
          where: >-
            {% if whole_house %}σε όλο το σπίτι
            {% else %}{% set n = namespace(out=[]) %}{% for i in room_ids %}{% set n.out = n.out + [names[i | int]] %}{% endfor %}
            {% if n.out | count == 1 %}{{ n.out[0] }}{% else %}{{ n.out[:-1] | join(', ') }} και {{ n.out[-1] }}{% endif %}{% endif %}
      - set_conversation_response: "{{ mode_text[clean_mode | trim] }} {{ where | trim }}."

  - id: home_vacuum_voice_control
    alias: Home Vacuum - Voice Control
    description: Εκκίνηση, στάση, παύση, συνέχεια, βάση, μπαταρία και κατάσταση της σκούπας σπιτιού.
    mode: single
    triggers:
      - trigger: conversation
        id: start
        command: ["ξεκίνα τη σκούπα", "ξεκίνα το καθάρισμα"]
      - trigger: conversation
        id: stop
        command: ["σταμάτα τη σκούπα", "σταμάτα το καθάρισμα"]
      - trigger: conversation
        id: pause
        command: ["κάνε παύση [στη σκούπα]", "παύση καθαρισμού", "πάγωσε τη σκούπα"]
      - trigger: conversation
        id: resume
        command: ["συνέχισε τη σκούπα", "συνέχισε το καθάρισμα", "συνέχισε από εκεί που σταμάτησες"]
      - trigger: conversation
        id: dock
        command: ["(γύρνα|πήγαινε) στη (βάση|θέση σου)", "γύρνα τη σκούπα στη βάση", "στείλε τη σκούπα στη βάση"]
      - trigger: conversation
        id: battery
        command: ["(πόση|τι) μπαταρία έχει η σκούπα", "πόσο φορτισμένη είναι η σκούπα"]
      - trigger: conversation
        id: status
        command: ["τι κάνει [τώρα] η σκούπα", "ποια είναι η κατάσταση της σκούπας", "[είναι ]η σκούπα [είναι ]στη βάση"]
    conditions: []
    actions:
      - alias: "Guard: μόνο από το floor home"
        if:
          - condition: template
            value_template: >-
              {% set d = trigger.device_id | default(none) %}
              {% set a = area_id(d) if d else none %}
              {{ d is not none and not (a in ['living_room', 'nefeli_room', 'alex_room', 'bedroom', 'office'] or floor_id(d) == 'home') }}
        then:
          - set_conversation_response: Αυτό γίνεται μόνο από το σπίτι.
          - stop: Εκτός scope (home)
      - variables:
          battery: "{{ state_attr('vacuum.home_vacuum', 'battery_level') | int(0) }}"
          status: "{{ state_attr('vacuum.home_vacuum', 'vacuum.status_desc') }}"
          status_text: >-
            {{ {'Charged': 'είναι φορτισμένη και βρίσκεται στη βάση',
                'Charging': 'φορτίζει στη βάση',
                'Cleaning': 'καθαρίζει',
                'Paused': 'είναι σε παύση',
                'Returning': 'επιστρέφει στη βάση'}.get(status, 'είναι σε κατάσταση ' ~ status) }}
      - choose:
          - conditions: "{{ trigger.id == 'start' }}"
            sequence:
              - if: "{{ battery < 20 }}"
                then:
                  - set_conversation_response: Η μπαταρία είναι στο {{ battery }}%. Άφησέ τη να φορτίσει λίγο πρώτα.
                else:
                  - action: script.home_vacuum_clean
                    data:
                      mode: normal
                  - set_conversation_response: Ξεκινάω σκούπισμα σε όλο το σπίτι.
          - conditions: "{{ trigger.id == 'stop' }}"
            sequence:
              - action: vacuum.stop
                target:
                  entity_id: vacuum.home_vacuum
              - set_conversation_response: Σταμάτησα τη σκούπα.
          - conditions: "{{ trigger.id == 'pause' }}"
            sequence:
              - action: vacuum.pause
                target:
                  entity_id: vacuum.home_vacuum
              - set_conversation_response: Έκανα παύση στη σκούπα.
          - conditions: "{{ trigger.id == 'resume' }}"
            sequence:
              - action: button.press
                target:
                  entity_id: button.home_vacuum_continue_sweep
              - set_conversation_response: Η σκούπα συνεχίζει από εκεί που σταμάτησε.
          - conditions: "{{ trigger.id == 'dock' }}"
            sequence:
              - action: vacuum.return_to_base
                target:
                  entity_id: vacuum.home_vacuum
              - set_conversation_response: Η σκούπα επιστρέφει στη βάση.
          - conditions: "{{ trigger.id == 'battery' }}"
            sequence:
              - set_conversation_response: Η μπαταρία της σκούπας είναι στο {{ battery }}%.
          - conditions: "{{ trigger.id == 'status' }}"
            sequence:
              - set_conversation_response: Η σκούπα {{ status_text }}. Μπαταρία {{ battery }}%.
