# packages/home/home_vacuum.yaml (scope: home, βήμα 7)
#
# Σκούπα σπιτιού (Xiaomi S20+, xiaomi.vacuum.b108gl) → vacuum.home_vacuum
#
# - script.home_vacuum_clean(rooms, mode): ΟΛΗ η λογική καθαρισμού, σε ένα σημείο.
# - automation «Home Vacuum - Voice Clean»: «σκούπισε / καθάρισε / σφουγγάρισε <δωμάτια>».
#   Mode από λέξεις-κλειδιά της φράσης, δωμάτια από λέξεις-κλειδιά (οποιοσδήποτε συνδυασμός).
# - Γενικές εντολές (ξεκίνα, σταμάτα, παύση, βάση, μπαταρία, κατάσταση, «σκούπισε εδώ»): shared/shared_vacuum.yaml (βήμα 8γ).
# - Απαντήσεις ΜΟΝΟ με set_conversation_response (ακούγονται στο ηχείο του δωματίου της εντολής).
#
# Room IDs (χάρτης της σκούπας): 3 σαλόνι · 4 WC · 5 χολ · 7 Νεφέλη · 8 κρεβατοκάμαρα · 9 Αλεξάνδρα · 10 μπάνιο

script:
  home_vacuum_clean:
    alias: Home Vacuum - Clean
    description: >-
      Καθαρισμός με τη σκούπα του σπιτιού. rooms = λίστα room IDs (κενή = όλο το σπίτι).
      mode = normal (Basic) | strong | quiet | mop (σκούπισμα+σφουγγάρισμα, νερό Level2) | mop_wet (νερό Level3).
    mode: single
    icon: mdi:robot-vacuum
    fields:
      rooms:
        name: Δωμάτια (room IDs)
        description: "3 σαλόνι, 4 WC, 5 χολ, 7 Νεφέλη, 8 κρεβατοκάμαρα, 9 Αλεξάνδρα, 10 μπάνιο. Κενό = όλο το σπίτι."
        example: "[3, 5]"
        selector:
          object:
      mode:
        name: Mode
        default: normal
        selector:
          select:
            options:
              - normal
              - strong
              - quiet
              - mop
              - mop_wet
    variables:
      clean_mode: "{{ mode if (mode is defined and mode) else 'normal' }}"
      room_ids: "{{ rooms if (rooms is defined and rooms) else [] }}"
      fan: >-
        {{ {'strong': 'Strong', 'quiet': 'Silent'}.get(clean_mode, 'Basic') }}
      mopping: "{{ clean_mode in ['mop', 'mop_wet'] }}"
      water: "{{ 'Level3' if clean_mode == 'mop_wet' else 'Level2' }}"
    sequence:
      # 1. Τύπος καθαρισμού (σκούπισμα ή σκούπισμα+σφουγγάρισμα)
      - if: "{{ mopping }}"
        then:
          - action: xiaomi_miot.set_miot_property
            data:
              entity_id: vacuum.home_vacuum
              siid: 2
              piid: 3
              value: 3
          - action: select.select_option
            target:
              entity_id: select.home_vacuum_mop_water_output_level
            data:
              option: "{{ water }}"
        else:
          - action: select.select_option
            continue_on_error: true
            target:
              entity_id: select.home_vacuum_sweep_mop_type
            data:
              option: Sweep
      # 2. Ισχύς
      - action: vacuum.set_fan_speed
        continue_on_error: true
        target:
          entity_id: vacuum.home_vacuum
        data:
          fan_speed: "{{ fan }}"
      # 3. Εκκίνηση: δωμάτια ή όλο το σπίτι
      - if: "{{ room_ids | count > 0 }}"
        then:
          - action: xiaomi_miot.call_action
            data:
              entity_id: vacuum.home_vacuum
              siid: 2
              aiid: 13
              # λίστα με ΕΝΑ string JSON, π.χ. ['{"room": [3, 5]}'] (όχι dict, το xiaomi_miot θέλει κείμενο)
              params: "{{ [ {'room': room_ids | map('int') | list} | to_json ] }}"
        else:
          - if: "{{ mopping }}"
            then:
              - action: button.press
                target:
                  entity_id: button.home_vacuum_start_sweep_mop
            else:
              - action: vacuum.start
                target:
                  entity_id: vacuum.home_vacuum

  home_vacuum_clean_selected:
    alias: Home Vacuum - Clean Selected
    description: Καθαρίζει τα δωμάτια που είναι επιλεγμένα στο dashboard, με τον τρόπο του dashboard. Μετά ξεεπιλέγει.
    mode: single
    icon: mdi:play-circle
    variables:
      room_map:
        input_boolean.home_vacuum_room_living_room: 3
        input_boolean.home_vacuum_room_wc: 4
        input_boolean.home_vacuum_room_hall: 5
        input_boolean.home_vacuum_room_nefeli: 7
        input_boolean.home_vacuum_room_bedroom: 8
        input_boolean.home_vacuum_room_alex: 9
        input_boolean.home_vacuum_room_bathroom: 10
      selected: "{{ room_map.keys() | select('is_state', 'on') | list }}"
      rooms: "{{ selected | map('extract', room_map) | list }}"
      mode_map:
        Κανονικό: normal
        Δυνατό: strong
        Ήσυχο: quiet
        Σκούπισμα + σφουγγάρισμα: mop
        Σφουγγάρισμα με πολύ νερό: mop_wet
      clean_mode: "{{ mode_map.get(states('input_select.home_vacuum_dashboard_mode'), 'normal') }}"
    sequence:
      - if: "{{ rooms | count == 0 }}"
        then:
          - action: persistent_notification.create
            data:
              title: Σκούπα
              message: Δεν διάλεξες δωμάτιο. Για όλο το σπίτι πάτα «Όλο το σπίτι».
              notification_id: home_vacuum_no_room
          - stop: Κανένα δωμάτιο
      - action: script.home_vacuum_clean
        data:
          rooms: "{{ rooms }}"
          mode: "{{ clean_mode }}"
      - action: input_boolean.turn_off
        target:
          entity_id: "{{ selected }}"

  home_vacuum_clean_all:
    alias: Home Vacuum - Clean All
    description: Όλο το σπίτι, με τον τρόπο που είναι επιλεγμένος στο dashboard.
    mode: single
    icon: mdi:home-floor-g
    variables:
      mode_map:
        Κανονικό: normal
        Δυνατό: strong
        Ήσυχο: quiet
        Σκούπισμα + σφουγγάρισμα: mop
        Σφουγγάρισμα με πολύ νερό: mop_wet
    sequence:
      - action: script.home_vacuum_clean
        data:
          rooms: []
          mode: "{{ mode_map.get(states('input_select.home_vacuum_dashboard_mode'), 'normal') }}"

# ── Dashboard (βήμα 12): επιλογή δωματίων και mode με αγγίγματα από το κινητό ──
input_boolean:
  home_vacuum_room_living_room: {name: Σαλόνι, icon: mdi:sofa}
  home_vacuum_room_hall: {name: Χολ, icon: mdi:door}
  home_vacuum_room_wc: {name: WC, icon: mdi:toilet}
  home_vacuum_room_nefeli: {name: Νεφέλη, icon: mdi:teddy-bear}
  home_vacuum_room_alex: {name: Αλεξάνδρα, icon: mdi:bookshelf}
  home_vacuum_room_bedroom: {name: Κρεβατοκάμαρα, icon: mdi:bed-king}
  home_vacuum_room_bathroom: {name: Μπάνιο, icon: mdi:shower}

input_select:
  home_vacuum_dashboard_mode:
    name: Τρόπος καθαρισμού
    icon: mdi:tune-variant
    options:
      - Κανονικό
      - Δυνατό
      - Ήσυχο
      - Σκούπισμα + σφουγγάρισμα
      - Σφουγγάρισμα με πολύ νερό

automation:
  - id: home_vacuum_voice_clean
    alias: Home Vacuum - Voice Clean
    description: «σκούπισε / καθάρισε / σφουγγάρισε <δωμάτια>», με δυνατά / ήσυχα / με πολύ νερό.
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "((σκούπισε|σκουπισε)|(καθάρισε|καθαρισε)|(σφουγγάρισε|σφουγγαρισε)) {rooms}"
          - "((σκούπισε|σκουπισε)|(καθάρισε|καθαρισε)) και (σφουγγάρισε|σφουγγαρισε) {rooms}"
    conditions: []
    actions:
      - alias: "Guard: μόνο από το floor home"
        if:
          - condition: template
            value_template: >-
              {% set d = trigger.device_id | default(none) %}
              {% set a = area_id(d) if d else none %}
              {{ d is not none and not (a in ['living_room', 'nefeli_room', 'alex_room', 'bedroom', 'office'] or floor_id(d) == 'home') }}
        then:
          - set_conversation_response: Αυτό γίνεται μόνο από το σπίτι.
          - stop: Εκτός scope (home)
      - variables:
          text: "{{ trigger.sentence | lower | replace('ά','α') | replace('έ','ε') | replace('ή','η') | replace('ί','ι') | replace('ό','ο') | replace('ύ','υ') | replace('ώ','ω') | replace('ϊ','ι') | replace('ΐ','ι') | replace('ϋ','υ') | replace('ΰ','υ') }}"  # χωρίς τόνους: οι λέξεις-κλειδιά παρακάτω γράφονται χωρίς τόνο
          clean_mode: >-
            {% if 'σφουγγαρ' in text %}{{ 'mop_wet' if 'πολυ νερο' in text else 'mop' }}
            {% elif 'δυνατ' in text %}strong
            {% elif 'ησυχ' in text or 'απαλ' in text %}quiet
            {% else %}normal{% endif %}
          # λέξη-κλειδί → (room IDs, όνομα για την απάντηση)
          room_ids: >-
            {% set ns = namespace(ids=[]) %}
            {% set kw = [
              ('σαλον', [3]), ('χολ', [5]), ('χωλ', [5]), ('hall', [5]),
              ('νεφελη', [7]), ('αλεξανδρ', [9]), ('παιδικ', [7, 9]),
              ('κρεβατοκαμαρ', [8]), ('υπνοδωματι', [8]),
              ('μπανιο', [10]),
              ('wc', [4]), ('βε σε', [4]), ('βεσε', [4]), ('τουαλετα', [4])
            ] %}
            {% for k, ids in kw %}{% if k in text %}{% set ns.ids = ns.ids + ids %}{% endif %}{% endfor %}
            {% if text is search('(^|\\s)w(\\s|$)') %}{% set ns.ids = ns.ids + [4] %}{% endif %}
            {{ ns.ids | unique | list }}
          whole_house: "{{ 'ολο το σπιτι' in text or 'παντου' in text }}"
          studio: "{{ 'στουντιο' in text or 'studio' in text or 'pink' in text }}"
      - if: "{{ studio }}"
        then:
          - set_conversation_response: Για τη σκούπα του studio πες «σκούπισε το στούντιο».
          - stop: Studio
      - if: "{{ not whole_house and room_ids | count == 0 }}"
        then:
          - set_conversation_response: >-
              Δεν κατάλαβα ποιο δωμάτιο. Πες για παράδειγμα «σκούπισε το σαλόνι» ή «σκούπισε όλο το σπίτι».
          - stop: Άγνωστο δωμάτιο
      - if: "{{ states('vacuum.home_vacuum') in ['unavailable', 'unknown'] }}"
        then:
          - set_conversation_response: Η σκούπα του σπιτιού δεν απαντάει αυτή τη στιγμή. Το Home Assistant δεν τη βλέπει, δοκίμασε σε λίγο.
          - stop: Σκούπα unavailable
      - if: "{{ 0 <= state_attr('vacuum.home_vacuum', 'battery_level') | int(-1) < 20 }}"
        then:
          - set_conversation_response: >-
              Η μπαταρία της σκούπας είναι στο {{ state_attr('vacuum.home_vacuum', 'battery_level') | int(0) }}%.
              Άφησέ τη να φορτίσει λίγο πρώτα.
          - stop: Χαμηλή μπαταρία
      - action: script.home_vacuum_clean
        data:
          rooms: "{{ [] if whole_house else room_ids }}"
          mode: "{{ clean_mode | trim }}"
      - variables:
          names:
            3: στο σαλόνι
            4: στο WC
            5: στο χολ
            7: στο δωμάτιο της Νεφέλης
            8: στην κρεβατοκάμαρα
            9: στο δωμάτιο της Αλεξάνδρας
            10: στο μπάνιο
          mode_text:
            normal: Ξεκινάω σκούπισμα
            strong: Ξεκινάω δυνατό σκούπισμα
            quiet: Ξεκινάω ήσυχο σκούπισμα
            mop: Ξεκινάω σκούπισμα και σφουγγάρισμα
            mop_wet: Ξεκινάω σφουγγάρισμα με πολύ νερό
          where: >-
            {% if whole_house %}σε όλο το σπίτι
            {% else %}{% set n = namespace(out=[]) %}{% for i in room_ids %}{% set n.out = n.out + [names[i | int]] %}{% endfor %}
            {% if n.out | count == 1 %}{{ n.out[0] }}{% else %}{{ n.out[:-1] | join(', ') }} και {{ n.out[-1] }}{% endif %}{% endif %}
      - set_conversation_response: "{{ mode_text[clean_mode | trim] }} {{ where | trim }}."

