# packages/home/home_announcements.yaml (scope: home, βήμα 6)
#
# «πες στη Νεφέλη να έρθει για φαγητό» → μιλάει στο δωμάτιο της Νεφέλης.
# Παραλήπτες: ένα trigger ανά παραλήπτη (id = area_id ή ομάδα kids/all). Οι λίστες του custom_sentences ΔΕΝ
# λειτουργούν στα triggers (εκεί κάθε {όνομα} είναι wildcard), γι' αυτό οι παραλλαγές γράφονται inline.
# Το HA Cloud STT συχνά χάνει την πρόθεση («πες Νεφέλη …»): με «πες» η πρόθεση είναι προαιρετική (βήμα 9).
# Έξοδος ήχου: script.voice_speak (packages/core/core_voice.yaml). Απάντηση στον χώρο της εντολής: set_conversation_response.

automation:
  - id: '1790276166517'
    alias: Voice - Ανακοινώσεις
    description: Φωνητικό μήνυμα σε δωμάτιο, ομάδα δωματίων ή σε όλο το σπίτι, μέσω script.voice_speak.
    mode: queued
    max: 10
    triggers:
      - trigger: conversation
        id: nefeli_room
        command:
          - "πες [(στη|στην|στο|στον|στα|σε) ]((Νεφέλη|Νεφελη)|(μικρή|μικρη)|(δωμάτιο|δωματιο) της (Νεφέλης|Νεφελης)) {message}"
          - "(στη|στην|στο|στον|στα|σε) ((Νεφέλη|Νεφελη)|(μικρή|μικρη)|(δωμάτιο|δωματιο) της (Νεφέλης|Νεφελης)) {message}"
          - "(ανακοίνωσε|ανακοινωσε) [(στη|στην|στο|στον|στα|σε) ]((Νεφέλη|Νεφελη)|(μικρή|μικρη)|(δωμάτιο|δωματιο) της (Νεφέλης|Νεφελης)) {message}"
      - trigger: conversation
        id: alex_room
        command:
          - "πες [(στη|στην|στο|στον|στα|σε) ]((Αλεξάνδρα|Αλεξανδρα)|(μεγάλη|μεγαλη)|(δωμάτιο|δωματιο) της (Αλεξάνδρας|Αλεξανδρας)) {message}"
          - "(στη|στην|στο|στον|στα|σε) ((Αλεξάνδρα|Αλεξανδρα)|(μεγάλη|μεγαλη)|(δωμάτιο|δωματιο) της (Αλεξάνδρας|Αλεξανδρας)) {message}"
          - "(ανακοίνωσε|ανακοινωσε) [(στη|στην|στο|στον|στα|σε) ]((Αλεξάνδρα|Αλεξανδρα)|(μεγάλη|μεγαλη)|(δωμάτιο|δωματιο) της (Αλεξάνδρας|Αλεξανδρας)) {message}"
      - trigger: conversation
        id: living_room
        command:
          - "πες [(στη|στην|στο|στον|στα|σε) ]((Χρήστο|Χρηστο)|(μπαμπά|μπαμπα)|(σαλόνι|σαλονι)) {message}"
          - "(στη|στην|στο|στον|στα|σε) ((Χρήστο|Χρηστο)|(μπαμπά|μπαμπα)|(σαλόνι|σαλονι)) {message}"
          - "(ανακοίνωσε|ανακοινωσε) [(στη|στην|στο|στον|στα|σε) ]((Χρήστο|Χρηστο)|(μπαμπά|μπαμπα)|(σαλόνι|σαλονι)) {message}"
      - trigger: conversation
        id: bedroom
        command:
          - "πες [(στη|στην|στο|στον|στα|σε) ]((Σάρα|Σαρα)|(μαμά|μαμα)|(κρεβατοκάμαρα|κρεβατοκαμαρα)) {message}"
          - "(στη|στην|στο|στον|στα|σε) ((Σάρα|Σαρα)|(μαμά|μαμα)|(κρεβατοκάμαρα|κρεβατοκαμαρα)) {message}"
          - "(ανακοίνωσε|ανακοινωσε) [(στη|στην|στο|στον|στα|σε) ]((Σάρα|Σαρα)|(μαμά|μαμα)|(κρεβατοκάμαρα|κρεβατοκαμαρα)) {message}"
      - trigger: conversation
        id: kids
        command:
          - "πες [(στη|στην|στο|στον|στα|σε) ]((παιδιά|παιδια)|(παιδικά|παιδικα) (δωμάτια|δωματια)) {message}"
          - "(στη|στην|στο|στον|στα|σε) ((παιδιά|παιδια)|(παιδικά|παιδικα) (δωμάτια|δωματια)) {message}"
          - "(ανακοίνωσε|ανακοινωσε) [(στη|στην|στο|στον|στα|σε) ]((παιδιά|παιδια)|(παιδικά|παιδικα) (δωμάτια|δωματια)) {message}"
      - trigger: conversation
        id: all
        command:
          - "πες [(στη|στην|στο|στον|στα|σε) ]((όλους|ολους)|(όλα|ολα) τα (ηχεία|ηχεια)|(όλο|ολο) το (σπίτι|σπιτι)) {message}"
          - "(στη|στην|στο|στον|στα|σε) ((όλους|ολους)|(όλα|ολα) τα (ηχεία|ηχεια)|(όλο|ολο) το (σπίτι|σπιτι)) {message}"
          - "(ανακοίνωσε|ανακοινωσε) [(στη|στην|στο|στον|στα|σε) ]((όλους|ολους)|(όλα|ολα) τα (ηχεία|ηχεια)|(όλο|ολο) το (σπίτι|σπιτι)) {message}"
    conditions: []
    actions:
      - alias: "Guard: μόνο από το floor home"
        if:
          - condition: template
            value_template: >-
              {% set d = trigger.device_id | default(none) %}
              {% set a = area_id(d) if d else none %}
              {{ d is not none and not (a in ['living_room', 'nefeli_room', 'alex_room', 'bedroom', 'office'] or floor_id(d) == 'home') }}
        then:
          - set_conversation_response: Αυτό γίνεται μόνο από το σπίτι.
          - stop: Εκτός scope (home)
      - variables:
          groups:
            kids: [nefeli_room, alex_room]
            all: [living_room, nefeli_room, alex_room, bedroom]
          target_key: "{{ trigger.id }}"
          target_areas: "{{ groups.get(target_key, [target_key]) }}"
          message: "{{ trigger.slots.message | trim }}"
      - repeat:
          for_each: "{{ target_areas }}"
          sequence:
            - action: script.voice_speak
              data:
                area: "{{ repeat.item }}"
                message: "{{ message }}"
      - variables:
          said_to:
            nefeli_room: στη Νεφέλη
            alex_room: στην Αλεξάνδρα
            living_room: στο σαλόνι
            bedroom: στην κρεβατοκάμαρα
            kids: στα παιδιά
            all: σε όλο το σπίτι
      - set_conversation_response: "Το είπα {{ said_to.get(target_key, target_key) }}."
