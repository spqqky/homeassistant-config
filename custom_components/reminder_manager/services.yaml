  description: Αλλάζει ΜΙΑ υπενθύμιση (ώρα, κείμενο, ειδοποιήσεις, παραλήπτες, επανάληψη). Ό,τι λείπει μένει ίδιο.
  fields:
    search_text:
      required: true
      selector:
        text:
    event_date:
      selector:
        text:
    new_text:
      selector:
        text:
    new_event_datetime:
      selector:
        text:
    new_before:
      selector:
        text:
    new_recipients:
      selector:
        text:
    new_repeat:
      selector:
        select:
          options: [none, daily, weekly, weekdays, monthly, yearly]
    new_days:
      selector:
        text:

