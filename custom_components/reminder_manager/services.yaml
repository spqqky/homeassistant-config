create_reminder:
  name: Create reminder
  description: Δημιουργεί υπενθύμιση στο calendar.reminders, με μία ή περισσότερες ειδοποιήσεις και προαιρετική επανάληψη.
  fields:
    text:
      required: true
      example: "Οδοντίατρος"
      selector:
        text:
    event_datetime:
      required: true
      description: Ώρα του γεγονότος, YYYY-MM-DD HH:MM (ώρα Ελλάδας).
      example: "2026-11-03 10:00"
      selector:
        text:
    before:
      description: Λεπτά πριν από το γεγονός, με κόμμα για πολλές ειδοποιήσεις (π.χ. 1440,60). Κενό = 0.
      example: "1440,60"
      selector:
        text:
    recipients:
      description: chris, nefeli, alex (με κόμμα). Κενό = chris.
      example: "chris"
      selector:
        text:
    repeat:
      default: none
      selector:
        select:
          options: [none, daily, weekly, weekdays, monthly, yearly]
    days:
      description: Μόνο για weekly. MO,TU,WE,TH,FR,SA,SU.
      example: "MO,TH"
      selector:
        text:
    until:
      description: Προαιρετικά, τέλος επανάληψης YYYY-MM-DD.
      selector:
        text:

